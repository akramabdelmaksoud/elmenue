services:
  - type: web
    name: elmenue
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPER_EMAIL
        sync: false
      - key: SUPER_PASSWORD
        sync: false
      - key: SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
