<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TableTab - Cafe login</title><meta name="robots" content="noindex">
<style>:root{--bg:#16130F;--card:#221d16;--line:#34291d;--text:#F5F0E6;--muted:#b3a894;--accent:#FF6B4A}*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);font:16px/1.5 Inter,system-ui,sans-serif}
.c{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px}h1{margin:0 0 6px;font-size:26px}h1 b{color:var(--accent)}p{color:var(--muted);margin:0 0 18px}
input{width:100%;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#100d08;color:var(--text);margin-bottom:12px}
button{width:100%;font:inherit;font-weight:700;padding:13px;border-radius:99px;border:0;background:var(--accent);color:#1a0d08;cursor:pointer}small{display:block;text-align:center;margin-top:16px;color:var(--muted)}a{color:inherit}</style></head>
<body><form class="c" onsubmit="go(event)"><h1>Table<b>Tab</b></h1><p>Enter your cafe's code to open your admin, captain, kitchen or cashier screens.</p>
<input id="s" placeholder="cafe code, e.g. my-cafe" autocomplete="off" autocapitalize="none" required><button>Open</button>
<small>Not a customer yet? <a href="/privacy" id="home">See TableTab</a></small></form>
<script>
document.getElementById('home').href = 'https://' + location.hostname.replace(/^app\./, '');
function go(e) { e.preventDefault(); var s = document.getElementById('s').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, ''); if (s) location.href = '/r/' + s; }
</script></body></html>
