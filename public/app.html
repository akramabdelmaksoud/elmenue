<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>TableTab - Venue login</title><meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tt-theme.css">
<style>
body{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
main{display:grid;place-items:center;padding:20px 0 50px}
.stage{position:relative;width:100%;max-width:470px}
.orb{position:absolute;width:260px;height:260px;inset-inline-end:-110px;top:-100px;border-radius:50%;z-index:0;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,0) 22%),conic-gradient(from 0deg,#ffc061,#ff9419,#ff6200,#ffd89b,#6dffb0,#ffc061);box-shadow:0 0 120px 10px rgba(255,98,0,.4),0 0 220px 30px rgba(255,148,25,.2),inset -24px -34px 70px rgba(5,6,10,.85);animation:spin 22s linear infinite,bob 9s ease-in-out infinite;opacity:.9}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{translate:0 -10px}50%{translate:0 12px}}
.panel{position:relative;z-index:2;padding:40px 36px 34px;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);background:linear-gradient(155deg,rgba(20,22,34,.78),rgba(10,11,18,.7));box-shadow:0 60px 120px -40px #000}
h1{font:300 clamp(26px,5vw,34px)/1.12 var(--disp);letter-spacing:-.025em;margin:6px 0 12px}body[dir=rtl] h1{font-family:Cairo;font-weight:700;letter-spacing:0}
h1 em{font-style:normal;font-weight:500;background:var(--irid);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
.sub{color:var(--muted);margin:0 0 26px;font-size:16.5px}
label{display:block;font:400 12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}body[dir=rtl] label{letter-spacing:0}
input{width:100%;font:500 17px Inter,Cairo,sans-serif;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:16px 18px;outline:none;transition:border-color .3s,box-shadow .3s,background .3s;margin-bottom:20px}
input:focus{border-color:var(--c3);background:rgba(255,255,255,.075);box-shadow:0 0 0 4px rgba(255,98,0,.22),0 10px 40px -12px rgba(255,98,0,.6)}
.go{width:100%;padding:17px;font-size:17px}
.more{text-align:center;margin-top:20px;color:var(--muted);font-size:15px}
footer{text-align:center;color:var(--dim);font:400 12.5px var(--mono);padding:18px 0 26px;letter-spacing:.06em}
</style></head><body>
<div class="wrap"><header><a class="logo" href="#" id="logo"><img class="mk" src="/logo.svg" alt=""><span>Table<b>Tab</b></span></a><button class="btn sm" id="lang" onclick="setLang()">عربي</button></header></div>
<div class="wrap"><main><div class="stage rv"><div class="orb"></div>
<form class="panel glass" data-tilt="off" onsubmit="return go(event)"><h1 data-i="h1">Open your <em>venue</em></h1>
<p class="sub" data-i="sub">Enter your venue's code to open your admin, captain, kitchen or cashier screens.</p>
<label for="s" data-i="code">Venue code</label><input id="s" placeholder="my-place" autocomplete="off" autocapitalize="none" spellcheck="false" required autofocus>
<button class="btn p go" type="submit" data-i="open">Open</button>
<div class="more"><span data-i="not">Not a customer yet?</span> <a href="/privacy" id="home" data-i="see">See TableTab</a></div></form></div></main></div>
<footer data-i="foot">TABLETAB</footer>
<script src="/tt-fx.js"></script>
<script>
var X = { en: { h1: 'Open your <em>venue</em>', sub: "Enter your venue's code to open your admin, captain, kitchen or cashier screens.", code: 'Venue code', open: 'Open', not: 'Not a customer yet?', see: 'See TableTab', foot: 'TABLETAB' },
  ar: { h1: 'افتح <em>مكانك</em>', sub: 'اكتب كود المكان لتفتح شاشات المالك والكابتن والمطبخ والكاشير.', code: 'كود المكان', open: 'فتح', not: 'لست عميلاً بعد؟', see: 'تعرّف على تابل تاب', foot: 'تابل تاب' } };
var lang = 'en'; try { lang = localStorage.getItem('tt:lang') || (/^ar/i.test(navigator.language) ? 'ar' : 'en'); } catch (e) {}
function paint() { var T = X[lang]; document.documentElement.lang = lang; document.body.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = T[el.dataset.i]; }); document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'عربي'; }
function setLang() { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('tt:lang', lang); } catch (e) {} paint(); }
document.getElementById('home').href = 'https://' + location.hostname.replace(/^app\./, '');
function go(e) { e.preventDefault(); var s = document.getElementById('s').value.trim().toLowerCase().replace(/[^a-z0-9-]/g, ''); if (s) location.href = '/r/' + s; return false; }
paint();
</script></body></html>
