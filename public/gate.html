<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>TableTab Showroom - Sign in</title><meta name="theme-color" content="#05060a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tt-theme.css">
<style>
body{display:grid;grid-template-rows:auto 1fr auto;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:22px 0}
main{display:grid;place-items:center;padding:20px 0 50px}
.stage{position:relative;width:100%;max-width:470px}
.orb{position:absolute;width:300px;height:300px;inset-inline-end:-120px;top:-110px;border-radius:50%;z-index:0;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,0) 22%),conic-gradient(from 0deg,#ff6b4a,#ff3d8b,#8a5bff,#2ee6d6,#6dffb0,#ff6b4a);box-shadow:0 0 120px 10px rgba(138,91,255,.4),0 0 220px 30px rgba(255,61,139,.2),inset -24px -34px 70px rgba(5,6,10,.85);animation:spin 22s linear infinite,bob 9s ease-in-out infinite;opacity:.9}
.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 70% 75%,rgba(5,6,10,.7),transparent 60%)}
.orb.b{width:150px;height:150px;inset-inline-end:auto;inset-inline-start:-70px;top:auto;bottom:-60px;animation-duration:30s,11s;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{translate:0 -10px}50%{translate:0 12px}}
.panel{position:relative;z-index:2;padding:40px 36px 34px;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);background:linear-gradient(155deg,rgba(20,22,34,.78),rgba(10,11,18,.7));box-shadow:0 60px 120px -40px #000}
h1{font:300 clamp(26px,5vw,34px)/1.12 var(--disp);letter-spacing:-.025em;margin:20px 0 12px}body[dir=rtl] h1{font-family:Cairo;font-weight:700;letter-spacing:0}
h1 em{font-style:normal;font-weight:500;background:var(--irid);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 7s linear infinite}
.sub{color:var(--muted);margin:0 0 28px;font-size:16.5px}
label{display:block;font:400 12.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}body[dir=rtl] label{letter-spacing:0}
.f{position:relative;margin-bottom:20px}
input{width:100%;font:500 17px Inter,Cairo,sans-serif;color:var(--text);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:16px;padding:16px 18px;outline:none;transition:border-color .3s,box-shadow .3s,background .3s}
input:focus{border-color:var(--c3);background:rgba(255,255,255,.075);box-shadow:0 0 0 4px rgba(138,91,255,.22),0 10px 40px -12px rgba(138,91,255,.6)}
.eye{position:absolute;inset-inline-end:8px;bottom:8px;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:18px}.eye:hover{background:var(--glass2);color:var(--text)}
#pw{padding-inline-end:54px}
.go{width:100%;padding:17px;font-size:17px;margin-top:6px}
.go[disabled]{opacity:.65;pointer-events:none}
.err{min-height:26px;margin-top:16px;color:#ff8aa6;font-size:15px;text-align:center}
.shake{animation:shake .45s}@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
.lock{display:inline-flex;align-items:center;gap:10px;font:400 12.5px var(--mono);letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:7px 15px;background:var(--glass)}body[dir=rtl] .lock{letter-spacing:0}
.lock i{width:7px;height:7px;border-radius:50%;background:var(--c2);box-shadow:0 0 12px var(--c2)}
footer{text-align:center;color:var(--dim);font:400 12.5px var(--mono);padding:18px 0 26px;letter-spacing:.06em}
@media(max-width:560px){.panel{padding:32px 24px 28px}.orb{width:210px;height:210px;top:-90px;inset-inline-end:-60px}}
</style></head><body>
<div class="wrap"><header><a class="logo" href="#"><i></i><span>Table<b>Tab</b></span></a><button class="btn sm" id="lang" onclick="setLang()">عربي</button></header></div>
<div class="wrap"><main><div class="stage rv"><div class="orb"></div><div class="orb b"></div>
<form class="panel glass" data-tilt="off" id="f" autocomplete="on" onsubmit="return signIn(event)">
<span class="lock"><i></i><span data-i="lock">PRIVATE SHOWROOM</span></span>
<h1 data-i="h1">Enter the <em>showroom</em></h1>
<p class="sub" data-i="sub">Sign in to open the live TableTab café, with every screen working together.</p>
<div class="f"><label for="u" data-i="user">User name</label><input id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus></div>
<div class="f"><label for="pw" data-i="pass">Password</label><input id="pw" name="password" type="password" autocomplete="current-password" required><button class="eye" type="button" onclick="eye()" aria-label="show">👁</button></div>
<button class="btn p go" id="go" type="submit"><span data-i="enter">Enter showroom</span></button>
<div class="err" id="err" role="alert"></div>
</form></div></main></div>
<footer data-i="foot">TABLETAB · AUTHORISED ACCESS ONLY</footer>
<script src="/tt-fx.js"></script>
<script>
var X = { en: { lock: 'PRIVATE SHOWROOM', h1: 'Enter the <em>showroom</em>', sub: 'Sign in to open the live TableTab café, with every screen working together.', user: 'User name', pass: 'Password', enter: 'Enter showroom', foot: 'TABLETAB · AUTHORISED ACCESS ONLY', bad: 'Wrong user name or password', many: 'Too many attempts. Try again in a few minutes.', net: 'No connection. Try again.' },
  ar: { lock: 'معرض خاص', h1: 'ادخل إلى <em>المعرض</em>', sub: 'سجّل الدخول لتفتح كافيه تابل تاب الحي بكل شاشاته وهي تعمل معاً.', user: 'اسم المستخدم', pass: 'كلمة المرور', enter: 'دخول المعرض', foot: 'تابل تاب · للمصرّح لهم فقط', bad: 'اسم المستخدم أو كلمة المرور غير صحيحة', many: 'محاولات كثيرة. حاول بعد دقائق.', net: 'لا يوجد اتصال. حاول مرة أخرى.' } };
var lang = 'en'; try { lang = localStorage.getItem('tt:lang') || (/^ar/i.test(navigator.language) ? 'ar' : 'en'); } catch (e) {}
function paint() { var T = X[lang]; document.documentElement.lang = lang; document.body.dir = lang === 'ar' ? 'rtl' : 'ltr'; document.querySelectorAll('[data-i]').forEach(function (el) { el.innerHTML = T[el.dataset.i]; }); document.getElementById('lang').textContent = lang === 'ar' ? 'English' : 'عربي'; }
function setLang() { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('tt:lang', lang); } catch (e) {} paint(); }
function eye() { var p = document.getElementById('pw'); p.type = p.type === 'password' ? 'text' : 'password'; }
async function signIn(ev) {
  ev.preventDefault(); var b = document.getElementById('go'), er = document.getElementById('err'), f = document.getElementById('f'); er.textContent = ''; b.disabled = true;
  try {
    var r = await fetch('/api/demo/gate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: document.getElementById('u').value, pass: document.getElementById('pw').value }) });
    if (r.ok) { b.querySelector('span').textContent = '✓'; location.reload(); return false; }
    er.textContent = X[lang][r.status === 429 ? 'many' : 'bad']; f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); document.getElementById('pw').select();
  } catch (e) { er.textContent = X[lang].net; }
  b.disabled = false; return false;
}
paint();
</script></body></html>
