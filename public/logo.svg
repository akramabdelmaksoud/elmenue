<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- TableTab mark: a table whose two halves are the letters T T, two cushioned chairs, a fork, a plate and a glass, inside a ring.
       Two colours, set from CSS as logo-a (wood) and logo-b (cushions, ring, the second T); the defaults are the site's orange and warm cream. -->
  <style>.sa { stroke: var(--logo-a, #ff8a1f); } .fa { fill: var(--logo-a, #ff8a1f); } .sb { stroke: var(--logo-b, #ffe2bd); } .fb { fill: var(--logo-b, #ffe2bd); } .sh { fill: #000; opacity: .22; }</style>
  <circle class="sb" cx="60" cy="60" r="54" stroke-width="3"/>
  <!-- chairs: wooden frame, cushioned back and seat -->
  <g id="chair">
    <path class="sa" d="M16.5 40.5c3.2 9.5 5.8 17.5 7.6 25.5H38" stroke-width="3.6"/>
    <path class="sa" d="M24 66l-3.2 20M36.5 66l2 20" stroke-width="3.6"/>
    <path class="sb" d="M21.6 44.5c2.2 6.3 3.8 11.5 4.9 16.3" stroke-width="4.4"/>
    <path class="sb" d="M28.5 61.6h8.6" stroke-width="4.4"/>
  </g>
  <use href="#chair" transform="translate(120 0) scale(-1 1)"/>
  <!-- the table: left T in wood, right T in the second colour, each with a shaded side -->
  <path class="fa" d="M35.5 48.5h23.3v7.3h-6.6V86h-7.1V55.8h-9.6z"/>
  <path class="sh" d="M50 55.8h2.2V86H50z"/>
  <path class="fb" d="M61.2 48.5h23.3v7.3h-9.6V86h-7.1V55.8h-6.6z"/>
  <path class="sh" d="M72.7 55.8h2.2V86h-2.2z"/>
  <!-- tableware -->
  <path class="sb" d="M45.5 36.5v11.5M43 36.5v4.2a2.5 2.5 0 0 0 5 0v-4.2" stroke-width="1.6"/>
  <path class="fb" d="M51 45.6h18.4a9.2 2.6 0 0 1-18.4 0z"/>
  <path class="sb" d="M72.5 36.8h6.6l-.9 10.8h-4.8z" stroke-width="1.5"/>
  <path class="fa" d="M73.5 41.6h4.6l-.5 5.1h-3.6z"/>
</svg>
