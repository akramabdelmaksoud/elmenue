<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Captain — Floor</title><link rel="stylesheet" href="/shared.css">
<style>
body { height:100vh; display:flex; flex-direction:column; overflow:hidden; }
header { display:flex; justify-content:space-between; align-items:center; padding:10px 18px; border-bottom:1px solid var(--line); gap:10px; flex-wrap:wrap; }
header h1 { margin:0; font-size:20px; }
.layout { flex:1; display:grid; grid-template-columns:1fr 380px; min-height:0; }
@media (max-width:900px) { .layout { grid-template-columns:1fr; overflow:auto; } body { overflow:auto; height:auto; } }
.floorwrap { padding:16px; overflow:auto; }
.floor { position:relative; display:grid; grid-template-columns:repeat(12,1fr); grid-template-rows:repeat(8,minmax(54px,1fr)); gap:6px; min-height:520px; height:calc(100vh - 150px); min-width:640px; border-radius:24px; padding:14px;
  background:repeating-linear-gradient(45deg,var(--card2) 0 14px,transparent 14px 28px), var(--card); border:1px solid var(--line); box-shadow:inset 0 0 60px rgba(0,0,0,.18); }
.table { border-radius:22px; border:3px solid var(--line); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-weight:800; position:relative; transition:background .5s, border-color .5s, transform .2s; cursor:pointer; padding:4px; background:#8884; color:var(--text); overflow:hidden; }
.table:hover { transform:scale(1.05); z-index:3; }
.table.round { border-radius:50%; } .table.long { border-radius:10px; }
.table .n { font-size:26px; line-height:1; } .table .s { font-size:11px; font-weight:600; opacity:.9; } .table .av { font-size:15px; letter-spacing:-2px; } .table .bd { position:absolute; top:3px; inset-inline-end:5px; font-size:13px; }
.table.empty { background:#8884; border-style:dashed; opacity:.7 } .table.seated { background:#1f9d55; border-color:#35d27a; color:#fff; } .table.ordered { background:#e08a1a; border-color:#ffb74d; color:#fff; }
.table.urgent { background:#d62828; border-color:#ff7676; color:#fff; animation:pulseRed 1s infinite; } .table.check { background:linear-gradient(135deg,#2563eb,#ffcc33); border-color:var(--gold); color:#fff; animation:glowGold 1.6s infinite; }
.side { border-inline-start:1px solid var(--line); overflow:auto; padding:14px; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; padding:0 16px 10px; } .legend i { display:inline-block; width:12px; height:12px; border-radius:4px; margin-inline-end:5px; vertical-align:-1px; }
.ocard { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px; margin-bottom:10px; animation:pop .3s; }
.ocard.flash { animation:glowGold 1s 3; }
.st { font-size:12px; padding:2px 10px; border-radius:99px; color:#fff; } .st.received { background:#5b6 } .st.kitchen { background:var(--warn) } .st.served { background:#3b82f6 } .st.closed { background:#777 }
.line { display:flex; justify-content:space-between; padding:2px 0; font-size:14px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.55); display:grid; place-items:center; z-index:50; backdrop-filter:blur(4px); }
.modal > .card { width:min(560px,94vw); max-height:90vh; overflow:auto; animation:pop .25s; }
#banners { position:fixed; top:70px; inset-inline-end:16px; display:flex; flex-direction:column; gap:8px; z-index:60; }
.banner { background:var(--text); color:var(--bg); padding:12px 18px; border-radius:14px; font-weight:700; box-shadow:0 10px 30px rgba(0,0,0,.4); animation:pop .3s; }
.banner.urgent { background:#d62828; color:#fff; } .banner.check { background:var(--gold); color:#222; }
h3 { margin:6px 0 10px; }
@media (max-width:700px) {
  header { padding:10px 12px; } header h1 { font-size:18px; } header .row button, header button { padding:8px 12px; }
  .legend { padding:0 12px 8px; gap:8px 12px; } .floorwrap { padding:10px 12px; overflow:visible; }
  .floor { min-width:0; height:auto; min-height:0; grid-template-columns:repeat(auto-fill,minmax(98px,1fr)); grid-template-rows:none; grid-auto-rows:98px; padding:10px; gap:10px; border-radius:20px; }
  .floor .table { grid-column:auto !important; grid-row:auto !important; }
  .table .n { font-size:24px; } .side { border-inline-start:0; border-top:1px solid var(--line); padding:12px; }
  .modal > .card { width:96vw; max-height:92vh; padding:14px; } #banners { inset-inline:10px; top:60px; } .banner { font-size:14px; }
}
@media (min-width:701px) and (max-width:1000px) { body { overflow:auto; height:auto; } .layout { grid-template-columns:1fr; overflow:visible; } .floor { min-width:0; height:min(68vh,640px); } .side { border-inline-start:0; border-top:1px solid var(--line); } }
</style></head>
<body>
<header><h1>🧑‍✈️ Captain · <span id="clock"></span></h1>
<div class="row wrap"><span id="stats" class="muted"></span>
<button class="ghost" id="snd" onclick="toggleSound()">🔕 Sound off</button>
<button class="ghost" id="sim" onclick="App.send({t:'sim',on:!App.state.simulate})">🤖 Simulate guests</button>
<button class="ghost" onclick="App.toggleLang()">EN/ع</button><button class="ghost" onclick="App.toggleMode()">◐</button>
<button class="ghost" onclick="App.logout()">Sign out</button></div></header>
<div class="legend">
<span><i style="background:#8884"></i>Empty</span><span><i style="background:#1f9d55"></i>Seated / browsing</span><span><i style="background:#e08a1a"></i>Order in progress</span><span><i style="background:#d62828"></i>Urgent request</span><span><i style="background:linear-gradient(135deg,#2563eb,#ffcc33)"></i>Check requested</span></div>
<div class="layout"><div class="floorwrap"><div class="floor" id="floor"></div></div><div class="side" id="side"></div></div>
<div id="banners"></div><div id="modal"></div>
<script src="/shared.js"></script>
<script>
let S = null, open = null, sound = false, actx = null;
const NEXT = { received: 'kitchen', kitchen: 'served', served: 'closed' };
const RQ = { waiter: '🙋 Call waiter', water: '💧 Water/napkins', urgent: '⚡ Speed up', bill: '🧾 Check' };
function beep(kind) {
  if (!sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const seq = kind === 'urgent' ? [880, 660, 880, 660] : kind === 'check' ? [660, 880, 1100] : [740, 988];
    seq.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = f; o.type = 'sine'; o.connect(g); g.connect(actx.destination); const t = actx.currentTime + i * 0.16; g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15); o.start(t); o.stop(t + 0.16); });
  } catch {}
}
function toggleSound() { sound = !sound; document.getElementById('snd').textContent = sound ? '🔔 Sound on' : '🔕 Sound off'; if (sound) beep('order'); }
setInterval(() => (document.getElementById('clock').textContent = new Date().toLocaleTimeString()), 1000);

function start() { App.connect({ t: 'join', role: 'captain' }, {
  render(m) { if (m) S = m; render(); },
  alert(m) {
    beep(m.kind);
    const b = document.createElement('div'); b.className = 'banner ' + (m.kind === 'urgent' ? 'urgent' : m.kind === 'check' ? 'check' : '');
    b.textContent = { order: '🍽️ ', urgent: '🚨 ', check: '🧾 ', request: '🔔 ', seat: '🪑 ' }[m.kind] + m.text;
    document.getElementById('banners').appendChild(b); setTimeout(() => b.remove(), 6000);
  },
}); }
App.gate('captain', start);
const guestsOf = (s) => s.guests.map((g) => g.avatar).join('');
function render() {
  if (!S) return;
  const cfg = S.config;
  document.getElementById('sim').classList.toggle('sel', !!S.simulate);
  const sessions = Object.values(S.sessions);
  const orders = sessions.flatMap((s) => s.orders.filter((o) => o.status !== 'closed').map((o) => ({ s, o }))).sort((a, b) => a.o.at - b.o.at);
  const reqs = sessions.flatMap((s) => s.requests.filter((r) => !r.done).map((r) => ({ s, r }))).sort((a, b) => a.r.at - b.r.at);
  const rev = sessions.reduce((n, s) => n + s.bill.total, 0);
  document.getElementById('stats').textContent = `${sessions.length}/${cfg.tables.length} tables · ${orders.length} open orders · ${App.money(rev)} live`;
  document.getElementById('floor').innerHTML = cfg.tables.map((t) => {
    const st = S.states[t.id], s = S.sessions[t.id];
    const lab = { empty: 'Empty', seated: 'Browsing', ordered: 'Ordered', urgent: 'URGENT', check: s?.check ? `${s.check.method === 'card' ? '💳' : '💵'} ${s.check.split}` : 'Check' }[st];
    const bd = s ? [s.requests.some((r) => !r.done && r.type === 'waiter') && '🙋', s.requests.some((r) => !r.done && r.type === 'water') && '💧', s.requests.some((r) => !r.done && r.type === 'urgent') && '⚡', s.check && '🧾'].filter(Boolean).join('') : '';
    return `<div class="table ${t.shape} ${st}" style="grid-column:${t.x}/span 2;grid-row:${t.y}/span 2" onclick="openT('${t.id}')"><span class="bd">${bd}</span><span class="n">${t.number}</span><span class="av">${s ? App.esc(guestsOf(s).slice(0, 12)) : '🪑'.repeat(Math.min(t.seats, 4) > 2 ? 1 : 1)}</span><span class="s">${lab}${s ? ' · ' + App.ago(s.startedAt) : ' · ' + t.seats + ' seats'}</span></div>`;
  }).join('');
  document.getElementById('side').innerHTML = `<h3>🔔 Requests (${reqs.length})</h3>${reqs.map(({ s, r }) => `<div class="ocard spread"><div><b>T${s.tableNumber}</b> ${RQ[r.type]}<div class="muted" style="font-size:12px">${App.ago(r.at)} ago</div></div><button class="primary" onclick="App.send({t:'resolve_request',tableId:'${s.tableId}',id:'${r.id}'})">Done</button></div>`).join('') || '<p class="muted">No pending requests</p>'}
  <h3>🍽️ Order stream (${orders.length})</h3>${orders.map(({ s, o }) => orderCard(s, o)).join('') || '<p class="muted">No open orders</p>'}`;
  if (open) renderModal();
}
function orderCard(s, o, compact) {
  const g = (id) => s.guests.find((x) => x.id === id)?.avatar || '🙂';
  const nxt = NEXT[o.status];
  return `<div class="ocard"><div class="spread"><b>Table ${s.tableNumber} <span class="muted">· ${s.guests.map((x) => x.avatar).join('')}</span></b><span class="st ${o.status}">${o.status}</span></div>
  ${o.items.map((i) => `<div class="line"><span>${g(i.guestId)} ${i.qty}× ${App.esc(i.name)}${i.note ? `<br><small style="color:var(--accent)">📝 ${App.esc(i.note)}</small>` : ''}</span><span>${App.money(i.qty * i.price)}</span></div>`).join('')}
  <div class="spread" style="margin-top:6px"><span class="muted">${App.ago(o.at)} ago · ${App.money(o.items.reduce((n, i) => n + i.qty * i.price, 0))}</span>${nxt ? `<button class="primary" onclick="App.send({t:'order_status',orderId:'${o.id}',status:'${nxt}'})">→ ${nxt}</button>` : ''}</div></div>`;
}
function openT(id) { open = id; renderModal(); }
function closeM() { open = null; document.getElementById('modal').innerHTML = ''; }
function renderModal() {
  const t = S.config.tables.find((x) => x.id === open), s = S.sessions[open];
  let h;
  if (!s) h = `<div class="spread"><h2>Table ${t.number}</h2><button onclick="closeM()">✕</button></div><p class="muted">No active QR session.</p><button class="primary" onclick="App.send({t:'seat_table',tableId:'${t.id}'})">🪑 Seat guests manually</button>`;
  else {
    const b = s.bill, tip = Math.round(b.sub * (s.check?.tipPct || 0) / 100);
    h = `<div class="spread"><h2>Table ${t.number} <span class="pill">${App.ago(s.startedAt)}</span></h2><button onclick="closeM()">✕</button></div>
    <div class="row wrap">${s.guests.map((g) => `<span class="pill" style="font-size:14px">${g.avatar} ${App.esc(g.name)} · ${App.money((b.byGuest[g.id] || {}).total || 0)}</span>`).join('') || '<span class="muted">No guests</span>'}</div>
    ${s.requests.filter((r) => !r.done).map((r) => `<div class="ocard spread" style="margin-top:10px"><span>${RQ[r.type]} · ${App.ago(r.at)}</span><button class="primary" onclick="App.send({t:'resolve_request',tableId:'${s.tableId}',id:'${r.id}'})">Done</button></div>`).join('')}
    ${s.cart.length ? `<p class="muted">🛒 In cart (not sent): ${s.cart.map((c) => c.qty + '× ' + App.esc(c.name)).join(', ')}</p>` : ''}
    <h3>Orders</h3>${s.orders.map((o) => orderCard(s, o)).join('') || '<p class="muted">No orders yet</p>'}
    <div class="card"><div class="line"><span>Subtotal</span><span>${App.money(b.sub)}</span></div><div class="line"><span>Service</span><span>${App.money(b.service)}</span></div><div class="line"><span>Tax</span><span>${App.money(b.tax)}</span></div>${s.check ? `<div class="line"><span>Tip (${s.check.tipPct}%)</span><span>${App.money(tip)}</span></div>` : ''}<div class="line"><b>Total</b><b>${App.money(b.total + tip)}</b></div></div>
    ${s.check ? `<div class="ocard" style="border-color:var(--gold)">🧾 <b>Check requested</b> by ${(s.guests.find((g) => g.id === s.check.by) || {}).avatar || ''} ${App.esc((s.guests.find((g) => g.id === s.check.by) || {}).name || 'guest')}${s.check.split === 'table' ? ` — <b>pays whole table: ${App.money(b.total + tip)}</b>` : ''} · ${s.check.method === 'card' ? '💳 Card' : '💵 Cash'} · split: <b>${s.check.split}</b>
      ${s.check.split === 'custom' && s.check.custom ? '<br>' + s.guests.map((g) => `${g.avatar} ${App.money(s.check.custom[g.id] || 0)}`).join(' · ') : ''}
      ${s.check.split === 'self' ? '<br>' + s.guests.map((g) => `${g.avatar} ${App.money((b.byGuest[g.id] || {}).total || 0)}`).join(' · ') : ''}</div>` : ''}
    <div class="row wrap" style="margin-top:12px"><button class="primary" onclick="App.send({t:'close_table',tableId:'${s.tableId}'});closeM()">✅ Paid · Clear table</button>${s.check ? '' : '<button class="ghost" onclick="App.send({t:\'close_table\',tableId:\'' + s.tableId + '\'});closeM()">Clear without payment</button>'}</div>
    <h3>Timeline</h3>${s.log.slice().reverse().map((l) => `<div class="line muted"><span>${App.esc(l.text)}</span><span>${new Date(l.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span></div>`).join('')}`;
  }
  document.getElementById('modal').innerHTML = `<div class="modal" onclick="if(event.target===this)closeM()"><div class="card">${h}</div></div>`;
}
</script></body></html>
