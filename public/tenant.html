<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant</title><link rel="stylesheet" href="/shared.css">
<style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.c{max-width:420px;width:100%;text-align:center}h1{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;color:transparent}a.card{display:block;text-decoration:none;color:inherit;margin-top:12px;transition:.2s}a.card:hover{transform:translateY(-3px);border-color:var(--accent)}</style></head>
<body><div class="c"><h1 id="n">…</h1><p class="muted">Scan the QR code on your table to order.</p>
<a class="card" id="cap">🧑‍✈️ Staff · Captain</a><a class="card" id="kit">🍳 Staff · Kitchen</a><a class="card" id="adm">🔐 Owner · Admin</a></div>
<script src="/shared.js"></script>
<script>
fetch('/api/config').then(r => r.ok ? r.json() : Promise.reject()).then(c => {
  App.config = c; App.applyTheme(); document.getElementById('n').textContent = c.settings.name; document.title = c.settings.name;
  document.getElementById('cap').href = '/r/' + App.slug + '/captain'; document.getElementById('adm').href = '/r/' + App.slug + '/admin'; document.getElementById('kit').href = '/r/' + App.slug + '/kitchen';
}).catch(() => { document.querySelector('.c').innerHTML = '<h2>Restaurant not found or suspended</h2>'; });
</script></body></html>
