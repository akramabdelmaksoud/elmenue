<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Games</title><meta name="robots" content="noindex">
<!-- Self-contained: no network, fonts or libraries, so it keeps working when the café wifi drops. Opened inside the guest app (iframe) or directly: /games.html?g=ludo|sudoku|solitaire&lang=ar -->
<style>
:root{--bg:#1a0f0a;--card:#2a170e;--line:#4a2d1c;--text:#fff4e6;--muted:#c9ab92;--acc:#ff7a2f;--acc2:#ffbe5c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}.sd,.pad,.lb,.sl,.lrow{direction:ltr}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;touch-action:manipulation}
body{padding:12px 12px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.top h1{font-size:20px;margin:0}
.btn{padding:10px 16px;border-radius:99px;background:var(--acc);color:#2a0d02;font-weight:800}.btn.g{background:var(--card);color:var(--text);border:1px solid var(--line)}
.menu{display:grid;gap:12px;margin-top:8px}.gm{display:flex;align-items:center;gap:14px;padding:16px;border-radius:22px;background:var(--card);border:1px solid var(--line);text-align:start;animation:rise .5s both}
.gm:nth-child(2){animation-delay:.08s}.gm:nth-child(3){animation-delay:.16s}.gm b{font-size:19px;display:block}.gm small{color:var(--muted)}.gm i{font-style:normal;font-size:40px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}
.msg{min-height:22px;text-align:center;color:var(--acc2);font-weight:700;margin:8px 0}
/* sudoku */
.sd{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid var(--acc);border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--card)}
.sd button{background:transparent;border:1px solid var(--line);font-size:clamp(16px,5.4vw,26px);font-weight:700;color:var(--text);padding:0;display:grid;place-items:center}
.sd button:nth-child(9n+3),.sd button:nth-child(9n+6){border-inline-end:2px solid var(--acc)}.sd button:nth-child(n+19):nth-child(-n+27),.sd button:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--acc)}
.sd .fx{color:var(--acc2);background:#ffffff0a}.sd .sel{background:#ff7a2f55}.sd .rel{background:#ff7a2f1c}.sd .bad{color:#ff5470}.sd .same{background:#ffbe5c33}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}.pad button{padding:12px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:20px;font-weight:800}.pad button:active{transform:scale(.92)}
/* ludo */
.lb{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#fff4e6;border:3px solid var(--acc)}
.lc{position:absolute;width:6.6667%;height:6.6667%;border:.5px solid #0002}
.pc{position:absolute;width:6.6667%;height:6.6667%;display:grid;place-items:center;transition:left .28s ease,top .28s ease,transform .2s;z-index:3}
.pc i{width:76%;height:76%;border-radius:50%;border:2px solid #fff;box-shadow:0 2px 4px #0006}.pc.can i{animation:pulse .7s infinite alternate;cursor:pointer}@keyframes pulse{to{transform:scale(1.28)}}
.dice{width:64px;height:64px;border-radius:16px;background:#fff;color:#222;font-size:36px;font-weight:900;display:grid;place-items:center;box-shadow:0 6px 0 #c9ab92}.dice.roll{animation:shake .45s}@keyframes shake{25%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(12deg) scale(1.1)}}
.lrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px}.who{font-weight:800;display:flex;align-items:center;gap:8px}.who i{width:16px;height:16px;border-radius:50%;display:inline-block}
/* solitaire */
.sl{--cw:calc((100vw - 24px - 36px)/7);--cwm:calc(min(var(--cw),70px))}
.srow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.slot{aspect-ratio:5/7;border-radius:8px;border:1px dashed var(--line);position:relative;color:var(--muted);display:grid;place-items:center;font-size:22px}
.cd{position:absolute;inset-inline:0;top:0;aspect-ratio:5/7;border-radius:8px;background:#fff;color:#111;font-weight:800;font-size:clamp(11px,3.4vw,17px);padding:3px 4px;box-shadow:0 1px 3px #0008;transition:transform .2s;line-height:1.1}
.cd.r{color:#d3213d}.cd.dn{background:repeating-linear-gradient(45deg,#8a3b12 0 6px,#a8481a 6px 12px);color:transparent;border:2px solid #fff}.cd.sel{outline:3px solid var(--acc2);transform:translateY(-4px);z-index:5}
.cd b{display:block;font-size:1.5em}.col{position:relative;aspect-ratio:5/7}.col .cd{position:absolute}

/* xo + words + lobby */
.xob{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:360px;margin:10px auto}.xob button{aspect-ratio:1;border-radius:18px;background:var(--card);border:2px solid var(--line);font-size:clamp(40px,16vw,72px);font-weight:900;line-height:1}.xob button.x{color:#ff7a2f}.xob button.o{color:#6ec6ff}.xob button.w{background:#ffbe5c33;border-color:var(--acc2);animation:pop .5s}@keyframes pop{50%{transform:scale(1.1)}}
.xov{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.xov div{flex:1;padding:10px;border-radius:16px;background:var(--card);border:2px solid var(--line);text-align:center;font-weight:800}.xov div.on{border-color:var(--acc);background:#ff7a2f22}
.lob{display:grid;gap:10px;margin-top:10px}.seat{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-weight:700}.seat.e{color:var(--muted);border-style:dashed}
.join{background:#1f7a4d;color:#fff;border-radius:16px;padding:12px 14px;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}.join button{background:#fff;color:#1f7a4d;border-radius:99px;padding:8px 16px;font-weight:900}
.clue{padding:14px;border-radius:18px;background:var(--card);border:1px solid var(--line);text-align:center;font-size:18px;font-weight:700;margin:8px 0}.clue small{display:block;color:var(--muted);font-weight:600;margin-bottom:4px}
.wslots,.wtiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0;direction:rtl}.wslots button,.wtiles button{width:48px;height:56px;border-radius:14px;font-size:28px;font-weight:900;background:var(--card);border:2px solid var(--line)}.wslots button{border-color:var(--acc);background:#ff7a2f14}.wslots button.ok{background:#1f7a4d;border-color:#2ecc71;color:#fff;animation:pop .5s}.wslots.bad{animation:shake .4s}.wtiles button{background:var(--acc);color:#2a0d02;border:0;box-shadow:0 4px 0 #b34d10}.wtiles button:disabled{opacity:.25;box-shadow:none}.wr{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
</style></head><body>
