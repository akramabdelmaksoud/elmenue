<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/floor.css">
<style>
.shell { display:grid; grid-template-columns:220px 1fr; min-height:100vh; } @media (max-width:800px){ .shell{grid-template-columns:1fr} aside{flex-direction:row!important;overflow:auto} }
aside { background:var(--card); border-inline-end:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; overflow-y:auto; overscroll-behavior:contain; scrollbar-width:none; -webkit-overflow-scrolling:touch; } aside::-webkit-scrollbar { display:none; }
@media (max-width:800px){ aside{height:auto;position:static} }
aside h2 { margin:0 8px 14px; font-size:18px; } aside button { text-align:start; background:none; } aside button.on { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); font-weight:700; }
main { padding:24px; overflow:auto; max-width:1200px; } h1 { margin-top:0; }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.kpi b { display:block; font-size:26px; margin-top:4px; } .kpi span { color:var(--muted); font-size:13px; }
.cat { display:flex; gap:8px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:12px; margin-bottom:6px; background:var(--card2); }
.cat .h { cursor:grab; padding:4px 8px; } .cat.act { outline:2px solid var(--accent); }
.cat input { padding:6px 8px; } .sortable-ghost { opacity:.35; }
table { width:100%; border-collapse:collapse; } td, th { padding:6px; text-align:start; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; } td input { padding:6px 8px; min-width:60px; }
.thumb { width:46px; height:46px; border-radius:10px; background:var(--card2) center/cover; display:grid; place-items:center; font-size:26px; cursor:pointer; }
.qr { text-align:center; break-inside:avoid; } .qr img { width:100%; max-width:220px; border-radius:12px; background:#fff; } .qr h3 { margin:8px 0 2px; font-size:28px; }
.heat { display:grid; grid-template-columns:40px repeat(24,1fr); gap:2px; font-size:10px; } .heat i { aspect-ratio:1; border-radius:3px; display:grid; place-items:center; font-style:normal; color:#fff; font-size:9px; }
.sw { width:44px; height:44px; padding:0; border:0; background:none; } .row2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin-top:14px; }
@media (max-width:800px) { main { padding:14px; } aside button { white-space:nowrap; } .row2 { grid-template-columns:1fr !important; } .card { overflow-x:auto; } h1 { font-size:24px; } input[type=checkbox] { width:22px; height:22px; } }
@media print { aside, .noprint, .shell > main > h1 { display:none!important } .shell { display:block } body { background:#fff; color:#000 } .qr { color:#000 } .card { border:1px solid #ccc; background:#fff } }
.mainwrap { min-width: 0; }
#rfbar { position: sticky; top: 0; z-index: 25; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 20px; font-size: 13px; background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
#rfbar .rfb { padding: 7px 14px; font-weight: 700; background: var(--accent); color: var(--on-accent); border-radius: 10px; } #rfbar .rfb.spin { opacity: .6; pointer-events: none; }
#rfbar select { width: auto; padding: 6px 10px; font-size: 13px; } #rfbar .rft { color: var(--muted); } #rfbar small { color: var(--muted); margin-inline-start: auto; }
@media print { #rfbar { display: none } }
#copset { position: absolute; inset: 0; z-index: 3; background: var(--card); border-radius: inherit; display: flex; flex-direction: column; }
#copset .ch { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 800; }
#copset .cbody { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; } #copset textarea { resize: vertical; }
#copset .mem { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; padding: 8px 10px; margin-bottom: 6px; background: var(--card2); border-radius: 10px; font-size: 13px; } #copset .mem button { padding: 2px 8px; flex: none; }
aside button[data-locked="true"]::after { content: ' 🔒'; opacity: .7; }
#cop { position: fixed; right: 16px; bottom: 16px; width: min(380px, calc(100vw - 32px)); height: min(520px, calc(100vh - 32px)); z-index: 90; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 22px; box-shadow: 0 24px 70px -20px rgba(0,0,0,.55); overflow: hidden; }
#cop .ch { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 800; }
#cop .cm { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
#cop .b { max-width: 88%; padding: 9px 13px; border-radius: 16px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; } #cop .b.u { align-self: flex-end; background: var(--accent); color: var(--on-accent, #fff); } #cop .b.a { align-self: flex-start; background: var(--card2); }
#cop .cs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 8px; } #cop .cs button { font-size: 12px; padding: 6px 10px; border-radius: 99px; }
#cop .ci { display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); } #cop .ci input { flex: 1; }
.bar { height: 10px; border-radius: 99px; background: var(--card2); overflow: hidden; } .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; } .kpis div { background: var(--card2); border-radius: 14px; padding: 12px; } .kpis b { display: block; font-size: 26px; }
.sbar { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; } .sbar small { font-size: 11px; } .sb { padding: 4px 10px; font-size: 12px; border-radius: 99px; } @media print { .noprint { display: none !important; } }
</style></head>
<body><div class="shell"><aside>
<h2>⚙️ Admin</h2>
<button data-t="analytics">📊 Analytics</button><button data-t="menu">🍽️ Menu builder</button><button data-t="inventory">📦 Inventory</button><button data-t="recipes" data-lock="recipes">🧪 Recipes & costing</button><button data-t="floor">🪑 Floor plan</button><button data-t="staff" data-lock="staff">👥 Staff</button><button data-t="attendance" data-lock="attendance">⏱ Attendance & shifts</button><button data-t="invoices" data-lock="invoicing">🧾 Invoices</button><button data-t="purchasing" data-lock="purchasing">🚚 Suppliers & purchasing</button><button data-t="ownerreport" data-lock="ownerreport">📑 Owner report</button><button data-t="orders">🧾 Orders</button><button data-t="reports">📈 Reports</button><button data-t="theme">🎨 Theme & settings</button><button data-t="qr">🔳 Table QR codes</button><button data-t="audit">📜 Audit log</button><button data-t="insights" data-lock="insights">🧠 Insights</button><button data-t="offers" data-lock="coupons">🎟️ Offers & gift cards</button><button data-t="loyalty" data-lock="loyalty">💳 Loyalty</button><button data-t="ocr" data-lock="ocr">📷 AI menu scan</button><button data-t="branches" data-lock="branches">🏢 Branches</button><button onclick="copilotToggle()" data-lock="copilot">🤖 AI Copilot</button>
<span style="flex:1"></span><button onclick="App.toggleLang()">🌐 EN / عربي</button><button onclick="App.roleMenu(event)">⇄ Switch role</button><button onclick="App.skinMenu(event)">🎨 Look (Maison)</button><button onclick="App.toggleMode(event)">◐ Light / Dark</button><button onclick="App.logout()">⏻ Sign out</button></aside>
<div class="mainwrap"><div id="rfbar"></div><main id="main"></main></div></div>
<script src="/vendor/sortable.js"></script><script src="/vendor/chart.js"></script><script src="/shared.js"></script><script src="/itemdlg.js"></script><script src="/office.js"></script><script src="/ar-ui.js"></script>
<script>
let tab = App.ls('admintab') || 'analytics', cfgKey = '', actCat = null, days = 7, charts = [], A = null;
const api = (m, u, b) => fetch(u, { method: m, headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(r => r.json()).then((r) => { if (m !== 'GET' && !/\/copilot/.test(u) && !(r && r.error)) setTimeout(afterWrite, 0); return r; });
const $ = (s) => document.querySelector(s);
/* ---------------- premium tiers: loyalty, AI menu scan, branches, copilot, welcome screen ---------------- */
const FEAT = () => (App.config && App.config.features) || {};
const PLAN_NAME = { basic: 'Basic', operations: 'Operations', vip: 'VIP' };
const lockedCard = (title, feat) => { const need = { staff: 'Operations', insights: 'Operations', invoicing: 'Operations', attendance: 'Operations' }[feat] || 'VIP'; $('#main').innerHTML = `<h1>${title}</h1><div class="card" style="text-align:center;padding:44px 20px"><div style="font-size:54px">🔒</div><h3>${need} plan</h3><p class="muted">This feature is part of the ${need} tier. Ask your account manager to upgrade your subscription.</p></div>`; };
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
async function offersTab() {
  if (FEAT().coupons === false) return lockedCard('🎟️ Offers & gift cards', 'coupons');
  const d = await api('GET', '/api/coupons'), pr = App.config.settings.promo || {}, vip = FEAT().giftcards !== false, M = (x) => App.money(x);
  const gf = vip ? await api('GET', '/api/gifts') : null, rp = await api('GET', '/api/promo/report');
  const when = (o) => (o.start ? o.start + '–' + o.end : 'all day') + (o.days && o.days.length ? ' · ' + o.days.map((x) => DAYS[x]).join(' ') : ' · every day');
  $('#main').innerHTML = `<h1>🎟️ Offers & gift cards</h1>
  <div class="card"><h3>Switch</h3><div class="row wrap"><label class="row" style="gap:6px"><input type="checkbox" style="width:auto" ${pr.enabled ? 'checked' : ''} onchange="promoSet({enabled:this.checked,stack:${!!pr.stack}})"> Coupons &amp; timed offers are on</label>
   <label class="row" style="gap:6px"><input type="checkbox" style="width:auto" ${pr.stack ? 'checked' : ''} onchange="promoSet({enabled:${!!pr.enabled},stack:this.checked})"> Let discounts add up (off = guest gets the single best one)</label></div></div>
  <div class="card"><h3>Coupon codes</h3><table><tr><th>Code</th><th>Value</th><th>Min spend</th><th>Uses</th><th>Valid</th><th>Saved</th><th></th></tr>
   ${d.coupons.map((c) => `<tr><td><b>${App.esc(c.code)}</b></td><td>${c.kind === 'pct' ? c.value + '%' : M(c.value)}</td><td>${c.minSpend ? M(c.minSpend) : '-'}</td><td>${c.uses || 0}${c.maxUses ? ' / ' + c.maxUses : ''}</td><td>${c.to ? 'until ' + new Date(c.to).toLocaleDateString('en-GB') : 'always'}</td><td>${M(c.saved || 0)}</td><td><button class="ghost" onclick="cpnToggle('${c.id}',${!c.active})">${c.active ? 'Pause' : 'Resume'}</button> <button class="ghost" onclick="cpnDel('${c.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="7" class="muted">No coupons yet.</td></tr>'}</table>
   <div class="row wrap" style="margin-top:10px"><input id="cc" placeholder="CODE" style="width:130px"><select id="ck" style="width:auto"><option value="pct">%</option><option value="amt">${App.esc(App.config.settings.currency)}</option></select><input id="cv" type="number" placeholder="value" style="width:90px"><input id="cm" type="number" placeholder="min spend" style="width:110px"><input id="cu" type="number" placeholder="max uses" style="width:100px"><input id="ct" type="date" title="last day" style="width:150px"><button onclick="cpnAdd()">Add coupon</button></div></div>
  <div class="card"><h3>Timed offers (applied automatically)</h3><table><tr><th>Offer</th><th>Value</th><th>When</th><th>Used</th><th>Saved</th><th></th></tr>
   ${d.offers.map((o) => `<tr><td><b>${App.esc(o.name)}</b></td><td>${o.kind === 'pct' ? o.value + '%' : M(o.value)}</td><td>${when(o)}</td><td>${o.uses || 0}</td><td>${M(o.saved || 0)}</td><td><button class="ghost" onclick="ofrToggle('${o.id}',${!o.active})">${o.active ? 'Pause' : 'Resume'}</button> <button class="ghost" onclick="ofrDel('${o.id}')">Delete</button></td></tr>`).join('') || '<tr><td colspan="6" class="muted">No offers yet.</td></tr>'}</table>
   <div class="row wrap" style="margin-top:10px"><input id="on" placeholder="Happy hour" style="width:150px"><select id="ok" style="width:auto"><option value="pct">%</option><option value="amt">${App.esc(App.config.settings.currency)}</option></select><input id="ov" type="number" placeholder="value" style="width:90px"><input id="os" type="time" style="width:110px" value="16:00"><input id="oe" type="time" style="width:110px" value="18:00"><span class="muted">days (none = every day):</span>${DAYS.map((x, i) => `<label class="row" style="gap:3px"><input type="checkbox" class="od" style="width:auto" value="${i}">${x}</label>`).join('')}<button onclick="ofrAdd()">Add offer</button></div></div>
  ${vip ? `<div class="card"><h3>Gift cards</h3><div class="grid"><div class="card"><small class="muted">Sold</small><div style="font-size:24px;font-weight:800">${M(gf.sold)}</div></div><div class="card"><small class="muted">Still to honour</small><div style="font-size:24px;font-weight:800">${M(gf.liability)}</div></div><div class="card"><small class="muted">Redeemed (paid bills)</small><div style="font-size:24px;font-weight:800">${M(rp.giftRedeemed)}</div></div></div>
   <table style="margin-top:8px"><tr><th>Code</th><th>Value</th><th>Balance</th><th>Sold</th><th>By</th></tr>${gf.gifts.slice(0, 40).map((g) => `<tr><td>${App.esc(g.code)}</td><td>${M(g.initial)}</td><td>${M(g.balance)}</td><td>${new Date(g.at).toLocaleDateString('en-GB')}</td><td>${App.esc(g.by || '')}</td></tr>`).join('') || '<tr><td colspan="5" class="muted">Cashiers sell gift cards from the till.</td></tr>'}</table></div>` : '<div class="card"><h3>Gift cards</h3><p class="muted">Gift cards need the VIP plan.</p></div>'}`;
}
const offerErr = (r) => r && r.error ? (App.toast(r.error), 1) : 0;
async function promoSet(p) { const r = await api('POST', '/api/settings', { promo: p }); App.toast(r.error || 'Saved'); App.config.settings.promo = p; offersTab(); }
async function cpnAdd() { const r = await api('POST', '/api/coupons', { code: $('#cc').value, kind: $('#ck').value, value: $('#cv').value, minSpend: $('#cm').value, maxUses: $('#cu').value, to: $('#ct').value ? $('#ct').value + 'T23:59:59' : '' }); if (!offerErr(r)) offersTab(); }
async function cpnToggle(id, a) { await api('PUT', '/api/coupons/' + id, { active: a }); offersTab(); }
async function cpnDel(id) { if (confirm('Delete this coupon? Past sales keep their record.')) { await api('DELETE', '/api/coupons/' + id); offersTab(); } }
async function ofrAdd() { const r = await api('POST', '/api/offers', { name: $('#on').value, kind: $('#ok').value, value: $('#ov').value, start: $('#os').value, end: $('#oe').value, days: [...document.querySelectorAll('.od:checked')].map((x) => +x.value) }); if (!offerErr(r)) offersTab(); }
async function ofrToggle(id, a) { await api('PUT', '/api/offers/' + id, { active: a }); offersTab(); }
async function ofrDel(id) { if (confirm('Delete this offer?')) { await api('DELETE', '/api/offers/' + id); offersTab(); } }
async function loyaltyTab() {
  if (!FEAT().loyalty) return lockedCard('💳 Loyalty program', 'loyalty');
  const d = await api('GET', '/api/loyalty'), c = d.config, cur = App.esc(App.config.settings.currency);
  $('#main').innerHTML = `<h1>💳 Loyalty program</h1><div class="row2">
   <div class="card"><h3>Earning & redemption ratios</h3>
    <label class="row" style="gap:10px;margin:8px 0"><input type="checkbox" style="width:22px;height:22px;flex:none" ${c.enabled ? 'checked' : ''} onchange="saveLoy({enabled:this.checked})"><b>Program enabled</b></label>
    <label class="muted">Earning: spend this much (${cur}) for 1 point</label><input type="number" min="1" value="${c.egpPerPoint}" onchange="saveLoy({egpPerPoint:+this.value})">
    <div class="grid" style="margin-top:8px"><div><label class="muted">Redemption: points…</label><input type="number" min="1" value="${c.pointsPerRedeem}" onchange="saveLoy({pointsPerRedeem:+this.value})"></div><div><label class="muted">…are worth (${cur} off the bill)</label><input type="number" min="0" value="${c.redeemValue}" onchange="saveLoy({redeemValue:+this.value})"></div></div>
    <p class="muted" style="margin-top:12px">Every <b>${c.egpPerPoint} ${cur}</b> spent = <b>1 point</b> · <b>${c.pointsPerRedeem} points</b> = <b>${c.redeemValue} ${cur}</b> discount. Guests join with their phone number from the Profile tab.</p></div>
   <div class="card"><h3>Today</h3><div class="kpis"><div><b>${d.members}</b><span class="muted">members</span></div><div><b>${d.outstanding}</b><span class="muted">points outstanding</span></div><div><b>${d.earnedToday}</b><span class="muted">earned today</span></div><div><b>${d.redeemedToday}</b><span class="muted">redeemed today (${Math.round(d.redeemedEgpToday)} ${cur})</span></div></div></div></div>
   <div class="card" style="margin-top:14px"><h3>Top members</h3>${d.top.length ? `<table><tr><th>Name</th><th>Phone</th><th>Points</th><th>Visits</th><th></th></tr>${d.top.map((m) => `<tr><td>${App.esc(m.name || '—')}</td><td>${App.esc(m.phone)}</td><td><b>${m.points}</b></td><td>${m.visits}</td><td><button onclick="adjPts('${m.phone}')">± points</button></td></tr>`).join('')}</table>` : '<p class="muted">No members yet - guests join from the Profile tab of the menu.</p>'}</div>`;
}
async function saveLoy(p) { const r = await api('POST', '/api/settings', { loyalty: { ...(App.config.settings.loyalty || {}), ...p } }); if (r.error) App.toast(r.error); }
async function adjPts(phone) { const v = prompt('Add or remove points (e.g. 50 or -20)'); if (!v) return; const r = await api('POST', '/api/loyalty/adjust', { phone, delta: +v }); App.toast(r.error || 'Updated'); cfgKey = ''; render(App.state, true); }
let OCR = [];
function ocrTab() {
  if (!FEAT().ocr) return lockedCard('📷 AI menu digitizer', 'ocr');
  $('#main').innerHTML = `<h1>📷 AI Photo OCR Menu Digitizer</h1><div class="card"><p class="muted">Upload a photo of an old paper menu, or a screenshot of any QR menu. The AI reads categories, item names, descriptions and prices into editable rows - review them, then import.</p>
   <input type="file" id="ocrf" accept="image/*" style="display:none" onchange="runOcr(this.files[0])"><button class="primary" onclick="$('#ocrf').click()">📸 Take / choose a photo</button></div><div id="ocrout"></div>`;
}
async function runOcr(f) {
  if (!f) return; const out = $('#ocrout'); out.innerHTML = '<div class="card" style="margin-top:14px">⏳ Reading the menu…</div>';
  const fd = new FormData(); fd.append('image', f);
  const r = await fetch('/api/menu/ocr', { method: 'POST', body: fd }).then((x) => x.json()).catch(() => ({ error: 'Upload failed' }));
  if (r.error) return (out.innerHTML = `<div class="card" style="margin-top:14px">⚠️ ${App.esc(r.error)}</div>`);
  OCR = r.items; drawOcr(r.simulated);
}
function drawOcr(sim) {
  const E = App.esc, inp = (i, k, w) => `<td><input style="min-width:${w || 90}px" value="${E(OCR[i][k] ?? '')}" onchange="OCR[${i}].${k}=this.value"></td>`;
  $('#ocrout').innerHTML = `<div class="card" style="margin-top:14px">${sim ? '<p class="muted">🧪 Sample reading: no AI key is set on this server (ANTHROPIC_API_KEY), so this shows the flow with a demo menu.</p>' : ''}
   <table><tr><th>Category</th><th>Name</th><th>الاسم (AR)</th><th>Price</th><th>Description</th><th></th></tr>${OCR.map((x, i) => `<tr>${inp(i, 'cat')}${inp(i, 'name', 130)}${inp(i, 'name_ar')}<td><input type="number" style="width:80px" value="${+x.price || 0}" onchange="OCR[${i}].price=+this.value"></td>${inp(i, 'desc', 150)}<td><button onclick="OCR.splice(${i},1);drawOcr(${!!sim})">✕</button></td></tr>`).join('')}</table>
   <div class="row" style="margin-top:12px"><button class="primary" onclick="importOcr()">✅ Import ${OCR.length} items to my menu</button></div></div>`;
}
async function importOcr() { const r = await api('POST', '/api/menu/ocr/import', { items: OCR }); App.toast(r.error || `Imported ${r.items} items (${r.categories} new categories)`); OCR = []; $('#ocrout').innerHTML = ''; }
let BR_DAYS = 30, BR_SORT = 'revenue';
async function branchesTab(days) {
  if (!FEAT().branches) return lockedCard('🏢 Multi-branch analytics', 'branches');
  if (days) BR_DAYS = days;
  const d = await api('GET', '/api/branches?days=' + BR_DAYS); if (d.error) return ($('#main').innerHTML = '<div class="card">' + App.esc(d.error) + '</div>');
  const E = App.esc, cur = E(d.currency || ''), T = d.totals, N = (x) => Math.round(+x || 0).toLocaleString('en-US'), dash = (x, f) => (x === null || x === undefined ? '<span class="muted">-</span>' : f(x));
  const arrow = (g) => (g === null ? '' : '<small style="color:' + (g >= 0 ? '#1f9d55' : '#d62828') + '">' + (g >= 0 ? '▲ ' : '▼ ') + Math.abs(g) + '%</small>');
  const spark = (arr, w = 120, h = 32) => { const m = Math.max(1, ...arr), n = Math.max(1, arr.length - 1); return '<svg width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><polyline fill="none" stroke="var(--accent,#8a6d3b)" stroke-width="1.6" points="' + arr.map((v, i) => (i / n * w).toFixed(1) + ',' + (h - 2 - v / m * (h - 4)).toFixed(1)).join(' ') + '"/></svg>'; };

// photos are shrunk in the browser first (max 900px, webp) so any phone photo uploads fast and fits the limit
async function shrink(file, max = 900) {
  const bmp = await createImageBitmap(file), k = Math.min(1, max / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(bmp.width * k)); c.height = Math.max(1, Math.round(bmp.height * k)); c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  let q = 0.86, b; do { b = await new Promise((r) => c.toBlob(r, 'image/webp', q)); q -= 0.14; } while (b && b.size > 600 * 1024 && q > 0.2);
  return b;
}
async function upImg(id, file, quiet) {
  if (!file || !/^image\//.test(file.type)) { if (!quiet) App.toast('Choose an image file'); return false; }
  try {
    const fd = new FormData(); fd.append('image', await shrink(file), 'photo.webp');
    const j = await (await fetch(`/api/items/${id}/image`, { method: 'POST', body: fd })).json();
    if (!quiet) App.toast(j.error || 'Photo saved ✓'); return !j.error;

}

// drop or choose many photos at once: each is matched to the item with the same name (cappuccino.jpg -> Cappuccino)
async function bulkImgs(files) {
  files = [...files].filter((f) => /^image\//.test(f.type)); if (!files.length) return App.toast('Choose image files');
  const I = App.config.items; let ok = 0; const miss = [];
  for (const f of files) {
    const n = norm(f.name), it = I.find((x) => norm(x.name) === n || norm(x.name_ar) === n) || I.find((x) => n && (norm(x.name).includes(n) || n.includes(norm(x.name))) && norm(x.name).length > 2);
    if (it && await upImg(it.id, f, true)) ok++; else miss.push(f.name);
  }
  App.toast(`${ok} photo${ok === 1 ? '' : 's'} added` + (miss.length ? ` · no matching item for: ${miss.slice(0, 4).join(', ')}${miss.length > 4 ? '…' : ''}` : ''));
}

  Chart.defaults.color = tx; Chart.defaults.borderColor = 'rgba(128,128,128,.2)';
  const mk = (id, cfg) => charts.push(new Chart($(id), cfg));
  const dk = Object.keys(A.daily).sort();
  mk('#c1', { type: 'line', data: { labels: dk.map(d => d.slice(5)), datasets: [{ data: dk.map(k => Math.round(A.daily[k])), borderColor: ac, backgroundColor: ac + '33', fill: true, tension: .35 }] }, options: { plugins: { legend: { display: false } } } });
  mk('#c2', { type: 'doughnut', data: { labels: ['Net sales', 'Service', 'Tax', 'Tips'], datasets: [{ data: [r.gross, r.service, r.tax, r.tips].map(Math.round), backgroundColor: [ac, ac2, '#3b82f6', '#2ecc71'], borderWidth: 0 }] } });
  mk('#c3', { type: 'bar', data: { labels: A.topItems.map(i => i.name), datasets: [{ data: A.topItems.map(i => i.qty), backgroundColor: ac, borderRadius: 6 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  mk('#c4', { type: 'bar', data: { labels: A.categories.map(c => c.name), datasets: [{ label: 'Revenue', data: A.categories.map(c => Math.round(c.revenue)), backgroundColor: ac2, borderRadius: 6 }, { label: 'Profit', data: A.categories.map(c => Math.round(c.profit)), backgroundColor: ac, borderRadius: 6 }] } });
  const T = App.config.tables.map(t => t.number);
  mk('#c5', { type: 'bar', data: { labels: T.map(n => 'T' + n), datasets: [{ data: T.map(n => A.perTable[n] || 0), backgroundColor: ac, borderRadius: 4 }] }, options: { plugins: { legend: { display: false } } } });
  const max = Math.max(1, ...A.heat.flat()), D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let h = '<div class="heat"><span></span>' + Array.from({ length: 24 }, (_, i) => `<span style="text-align:center">${i}</span>`).join('');
  A.heat.forEach((row, d) => { h += `<span>${D[d]}</span>` + row.map((v, hr) => `<i title="${D[d]} ${hr}:00 — ${v}" style="background:${v ? ac : 'var(--card2)'};opacity:${v ? 0.2 + 0.8 * v / max : 1}">${v || ''}</i>`).join(''); });
  $('#heat').innerHTML = h + '</div>';
}

/* ---------------- per-block export / clear ---------------- */
const EXP = {};
function statRows(A) {
  const k = A.kpi, P = k.prev, r = A.revenue, tv = A.turnover, M = (v) => Math.round(v * 100) / 100;
  EXP.kpi = ['Summary', [['Metric', 'This period', 'Previous period'], ['Revenue', M(k.revenue), M(P.revenue)], ['Orders', k.orders, P.orders], ['Average ticket', M(k.avg), M(P.avg)], ['Est. profit', M(k.profit), M(P.profit)]]];
  const dk = Object.keys(A.daily).sort();
  EXP.trend = [days === 1 ? 'Revenue by hour' : 'Revenue by day', [[days === 1 ? 'Hour' : 'Day', 'Revenue'], ...(days === 1 ? A.hourly.map((v, h) => [h + ':00', M(v)]) : dk.map((d) => [d, M(A.daily[d])]))]];
  EXP.cats = ['Sales by category', [['Category', 'Revenue', 'Profit'], ...A.categories.map((c) => [c.name, M(c.revenue), M(c.profit)])]];
  EXP.best = ['Best sellers', [['Item', 'Quantity', 'Revenue', 'Profit'], ...A.topItems.map((i) => [i.name, i.qty, M(i.revenue), M(i.profit)])]];
  EXP.details = ['Details', [['Metric', 'Value'], ['Gross sales', M(r.gross)], ['Taxes', M(r.tax)], ['Service charges', M(r.service)], ['Tips', M(r.tips)], ['Cash', M(r.cash)], ['Card', M(r.card)], ['Discounts', M(r.discounts)], ['Table sessions', r.sessions], ['Avg. table occupied (min)', Math.round(tv.avgOccupiedMin)], ['Avg. empty gap (min)', Math.round(tv.avgEmptyGapMin)], ['Turnover per table per day', M(tv.turnsPerTablePerDay)], ['Occupancy %', Math.round(tv.occupancyPct)]]];
  const D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  EXP.heat = ['Rush hours', [['Day', ...Array.from({ length: 24 }, (_, h) => h + ':00')], ...A.heat.map((row, d) => [D[d], ...row])]];
  EXP.tables = ['Table usage', [['Table', 'Sessions'], ...App.config.tables.map((t) => ['T' + t.number, A.perTable[t.number] || 0])]];
}
// the small buttons shown on every statistics block
function sb(key) {
  const rs = (A && A.resets) || {}, at = rs[key];
  return `<span class="sbar noprint">${at ? `<small class="muted">cleared ${new Date(at).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</small><button class="ghost sb" title="Bring the old numbers back" onclick="stClear('${key}',true)">↩</button>` : ''}<button class="ghost sb" onclick="stExport('${key}')">⬇ Export</button><button class="ghost sb" onclick="stClear('${key}')">🗑 Clear</button></span>`;
}
function stExport(key) {
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`, keys = key === 'all' ? Object.keys(EXP) : [key];
  const csv = keys.map((k) => (key === 'all' ? q(EXP[k][0]) + '\n' : '') + EXP[k][1].map((r) => r.map(q).join(',')).join('\n')).join('\n\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `${key === 'all' ? 'statistics' : EXP[key][0].toLowerCase().replace(/[^a-z0-9]+/g, '_')}_${days === 1 ? 'today' : days + 'd'}_${ld()}.csv`; a.click(); App.toast('Saved ✓');
}
async function stClear(key, restore) {
  if (!restore && !confirm(key === 'all' ? 'Clear ALL statistics?\n\nThey restart from zero now. Sales records, receipts and Orders history are kept, and you can restore them.' : 'Clear this statistic?\n\nIt restarts from zero now. Your sales records are kept and you can restore it. Tip: use Export first to save the numbers.')) return;
  await api('POST', '/api/stats/clear', { key, restore: !!restore }); App.toast(restore ? 'Restored ✓' : 'Cleared ✓'); cfgKey = ''; render(App.state, true);
}

/* ---------------- Insights block (period comparison, area chart, donut, best sellers, low stock) ---------------- */
function insights(A) {
  const k = A.kpi, P = k.prev, COL = ['#d9b36c', '#6aa7ff', '#5fd0a0', '#f07178', '#b48cf2', '#f0b95b'];
  const K = (l, v, dec, p, i) => { const d = p ? ((v - p) / p) * 100 : null; return `<div class="card mi-kpi"><div class="l">${l}</div><div class="v" data-count="${v}" data-dec="${dec}">0</div><div class="d">${d == null ? '<span class="muted">no earlier data to compare</span>' : `<span class="${d >= 0 ? 'mi-up' : 'mi-down'}">${d >= 0 ? '▲' : '▼'} ${Math.abs(d).toFixed(1)}% vs previous period</span>`}</div></div>`; };
  let keys, vals;
  if (days === 1) { keys = [...Array(24).keys()]; vals = A.hourly.map(Math.round); }
  else { keys = []; for (let i = days - 1; i >= 0; i--) keys.push(new Date(Date.now() - i * 864e5).toISOString().slice(0, 10)); vals = keys.map((x) => Math.round(A.daily[x] || 0)); }
  const W = 640, H = 210, max = Math.max(1, ...vals), px = (i) => 20 + (i * (W - 40)) / Math.max(1, keys.length - 1), py = (v) => H - 24 - (v / max) * (H - 50);
  const path = vals.map((v, i) => `${i ? 'L' : 'M'}${px(i).toFixed(1)},${py(v).toFixed(1)}`).join(' ');
  const cats = A.categories.filter((c) => c.revenue > 0), cTot = cats.reduce((n, c) => n + c.revenue, 0) || 1; let off = 0;
  const top = A.topItems.slice().sort((a, b) => b.revenue - a.revenue).slice(0, 8), tMax = (top[0] && top[0].revenue) || 1;
  const area = k.orders ? `<svg class="mi-area" viewBox="0 0 ${W} ${H}" style="width:100%"><defs><linearGradient id="mig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".45"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${[0, .5, 1].map((f) => `<line x1="20" x2="${W - 20}" y1="${py(max * f)}" y2="${py(max * f)}" stroke="var(--line)"/><text x="20" y="${py(max * f) - 4}" font-size="10" fill="var(--muted)">${Math.round(max * f)}</text>`).join('')}
    <path class="fill" d="${path} L${px(keys.length - 1)},${H - 24} L${px(0)},${H - 24}Z"/><path class="line" pathLength="1" d="${path}"/>
    ${vals.map((v, i) => (v ? `<circle class="dot" cx="${px(i)}" cy="${py(v)}" r="3.5"><title>${days === 1 ? keys[i] + ':00' : keys[i]} · ${App.money(v)}</title></circle>` : '')).join('')}
    ${keys.map((x, i) => (keys.length <= 12 || i % Math.ceil(keys.length / 8) === 0 ? `<text x="${px(i)}" y="${H - 6}" font-size="10" text-anchor="middle" fill="var(--muted)">${days === 1 ? x + 'h' : String(x).slice(8)}</text>` : '')).join('')}</svg>` : '<p class="muted" style="padding:30px 0;text-align:center">No sales in this period yet</p>';
  return `<div class="spread" style="margin-bottom:8px"><h3>Summary</h3>${sb('kpi')}</div><div class="mi-kpis mi-stag">${K('Revenue', k.revenue, 2, P.revenue, 0)}${K('Orders', k.orders, 0, P.orders, 1)}${K('Average ticket', k.avg, 2, P.avg, 2)}${K('Est. profit', k.profit, 2, P.profit, 3)}</div>
  <div class="row2"><div class="card"><div class="spread"><h3>${days === 1 ? 'Revenue by hour' : 'Revenue by day'}</h3>${sb('trend')}</div>${area}</div>
   <div class="card"><div class="spread"><h3>Sales by category</h3>${sb('cats')}</div><div class="row wrap" style="gap:24px;align-items:center"><svg class="mi-donut" viewBox="0 0 42 42" width="160" height="160"><circle cx="21" cy="21" r="15.9155" stroke="var(--card2)" style="animation:none;stroke-dasharray:100 0"/>
    ${cats.map((c, i) => { const len = (c.revenue / cTot) * 100, x = `<circle cx="21" cy="21" r="15.9155" pathLength="100" stroke="${COL[i % 6]}" style="--i:${i};--len:${len.toFixed(2)};stroke-dashoffset:${(-off).toFixed(2)}"/>`; off += len; return x; }).join('')}</svg>
    <div class="mi-legend" style="flex:1;min-width:140px">${cats.map((c, i) => `<div><i style="background:${COL[i % 6]}"></i>${App.esc(c.name)} <b style="float:inline-end">${((c.revenue / cTot) * 100).toFixed(0)}%</b></div>`).join('') || '<span class="muted">-</span>'}</div></div></div></div>
  <div class="row2" style="margin-top:14px"><div class="card"><div class="spread"><h3>Best sellers</h3>${sb('best')}</div>${top.map((x) => `<div class="mi-hbar"><span>${App.esc(x.emoji || '🍽️')} ${App.esc(x.name)}</span><div class="tr"><div class="fl" data-w="${(x.revenue / tMax) * 100}"></div></div><b style="text-align:end">${Math.round(x.revenue)}</b></div>`).join('') || '<p class="muted">No data yet</p>'}</div>
   <div class="card"><h3>Low stock</h3>${A.lowStock.length ? A.lowStock.map((i) => `<div class="spread" style="padding:7px 0;border-bottom:1px dashed var(--line)"><span>${App.esc(i.emoji || '')} ${App.esc(i.name)}</span><span class="mi-pill" style="color:${i.stock <= 0 ? 'var(--bad)' : 'var(--warn)'}">${i.stock <= 0 ? 'out' : i.stock + ' left'}</span></div>`).join('') : '<p style="color:var(--ok)">Everything is well stocked ✓</p>'}<p class="muted" style="font-size:12px;margin-bottom:0">Turn on stock counting per item in Inventory.</p></div></div>`;
}

/* ---------------- Orders history ---------------- */
const ld = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
let OD = { day: ld(), list: [] };
async function ordersTab() {
  const f = new Date(OD.day + 'T00:00:00').getTime(), t = f + 864e5 - 1;
  $('#main').innerHTML = '<h1>🧾 Orders</h1><div class="skeleton" style="height:220px"></div>';
  OD.list = (await api('GET', `/api/orders?from=${f}&to=${t}`)).orders || [];
  const paid = OD.list.filter((o) => !o.unpaid), rev = paid.reduce((n, o) => n + o.total, 0), M = App.money;
  $('#main').innerHTML = `<div class="spread wrap"><h1>🧾 Orders</h1><div class="row wrap noprint"><button class="ghost" onclick="OD.day=ld(new Date(new Date(OD.day).getTime()-864e5));ordersTab()">◀</button><input type="date" style="width:160px" value="${OD.day}" onchange="OD.day=this.value||ld();ordersTab()"><button class="ghost" onclick="OD.day=ld(new Date(new Date(OD.day).getTime()+864e5));ordersTab()">▶</button><button class="primary" onclick="odCsv()">⬇ CSV</button></div></div>
  <p class="muted">${paid.length} paid · ${M(rev)}${OD.list.length - paid.length ? ` · ${OD.list.length - paid.length} cleared unpaid` : ''}</p><div class="mi-stag">${OD.list.map((o, i) => `<details class="card" style="--i:${Math.min(i, 12)};margin-bottom:10px;padding:12px 16px"><summary style="cursor:pointer;display:flex;gap:12px;align-items:center;list-style:none;flex-wrap:wrap">
    <b class="serif" style="font-size:17px">${o.kind && o.kind !== 'table' ? ({ takeaway: '🛍️', delivery: '🛵' }[o.kind] || '') + ' ' : 'Table '}${App.esc(o.tableNumber)}</b><span class="muted" style="flex:1">${new Date(o.closedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${o.closedBy ? ' · ' + App.esc(o.closedBy) : ''}</span>
    <span class="mi-pill" style="color:${o.unpaid ? 'var(--bad)' : 'var(--ok)'}">${o.unpaid ? 'cleared unpaid' : App.esc(o.method)}</span><b>${M(o.total)}</b></summary>
    <table style="margin-top:8px">${o.items.map((l) => `<tr><td>${l.qty}× ${App.esc(l.name)}</td><td style="text-align:end">${M(l.qty * l.price)}</td></tr>`).join('')}
    ${o.discount ? `<tr><td class="muted">Discount ${App.esc(o.discountNote || '')}</td><td style="text-align:end">−${M(o.discount)}</td></tr>` : ''}<tr><td class="muted">Service + tax</td><td style="text-align:end">${M(o.service + o.tax)}</td></tr>${o.tip ? `<tr><td class="muted">Tip</td><td style="text-align:end">${M(o.tip)}</td></tr>` : ''}</table>
    ${(o.voids || []).length ? `<p class="muted" style="font-size:12px">Removed: ${o.voids.map((v) => v.qty + '× ' + App.esc(v.name) + (v.reason ? ' (' + App.esc(v.reason) + ')' : '')).join(', ')}</p>` : ''}
    <div class="row wrap" style="margin-top:8px"><button class="ghost" onclick="odPrint(${i})">🖨 Reprint</button></div></details>`).join('') || '<div class="card" style="text-align:center"><p class="muted">No orders on this day.</p></div>'}</div>`;
}
function odPrint(i) { const h = OD.list[i]; if (h) App.printHTML(App.receiptHTML({ label: h.tableNumber, kind: h.kind, customer: h.customer, at: h.closedAt, items: h.items, gross: h.sub, discount: h.discount, discountNote: h.discountNote, service: h.service, tax: h.tax, tip: h.tip, total: h.total, method: h.unpaid ? 'cleared unpaid' : h.method, pay: h.pay, by: h.closedBy })); }
function odCsv() {
  const q = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`, rows = [['table', 'type', 'closed', 'payment', 'item', 'qty', 'unit_price', 'line_total', 'order_total', 'closed_by'].join(',')];
  OD.list.forEach((o) => o.items.forEach((l) => rows.push([o.tableNumber, o.kind || 'table', new Date(o.closedAt).toISOString(), o.unpaid ? 'unpaid' : o.method, l.name, l.qty, l.price, l.qty * l.price, o.total, o.closedBy || ''].map(q).join(','))));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' })); a.download = `orders_${OD.day}.csv`; a.click();
}
function lookCard() {
  const s = App.config.settings, el = document.createElement('div'); el.className = 'card'; el.style.marginTop = '14px';
  el.innerHTML = `<h3>✨ Look</h3><p class="muted" style="margin-top:0">Pick the look new visitors see. Everyone can still choose their own with the 🎨 button, and it is remembered for them.</p>
   <select style="max-width:280px" onchange="api('POST','/api/settings',{skin:this.value})">${[['default', 'Restaurant theme (below)'], ['maison-dark', 'Maison · dark'], ['maison-light', 'Maison · light']].map(([k, l]) => `<option value="${k}" ${(s.skin || 'default') === k ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  $('#main').appendChild(el);
}

/* ---------------- Audit ---------------- */
async function audit() {
  const a = await api('GET', '/api/analytics?days=30');
  const f = (ts) => ts ? new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  $('#main').innerHTML = `<h1>📜 Order audit log</h1><div class="card" style="overflow:auto"><table><tr><th>Table</th><th>Entered</th><th>First order</th><th>Check requested</th><th>Cleared</th><th>Guests</th><th>Payment</th><th>Total</th></tr>
  ${a.audit.map(r => `<tr><td><b>${r.tableNumber}</b> ${r.live ? '<span class="pill" style="color:var(--ok)">LIVE</span>' : ''}</td><td>${f(r.startedAt)}</td><td>${f(r.orderedAt)}</td><td>${f(r.checkAt)}</td><td>${r.live ? 'occupied' : f(r.closedAt)}</td><td>${r.guests}</td><td>${r.method}</td><td>${App.money(r.total)}</td></tr>`).join('')}</table></div>`;
}
