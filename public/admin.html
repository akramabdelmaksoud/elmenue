<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title><link rel="stylesheet" href="/shared.css"><link rel="stylesheet" href="/floor.css">
<style>
.shell { display:grid; grid-template-columns:220px 1fr; min-height:100vh; } @media (max-width:800px){ .shell{grid-template-columns:1fr} aside{flex-direction:row!important;overflow:auto} }
aside { background:var(--card); border-inline-end:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
@media (max-width:800px){ aside{height:auto;position:static} }
aside h2 { margin:0 8px 14px; font-size:18px; } aside button { text-align:start; background:none; } aside button.on { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); font-weight:700; }
main { padding:24px; overflow:auto; max-width:1200px; } h1 { margin-top:0; }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.kpi b { display:block; font-size:26px; margin-top:4px; } .kpi span { color:var(--muted); font-size:13px; }
.cat { display:flex; gap:8px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:12px; margin-bottom:6px; background:var(--card2); }
.cat .h { cursor:grab; padding:4px 8px; } .cat.act { outline:2px solid var(--accent); }
.cat input { padding:6px 8px; } .sortable-ghost { opacity:.35; }
table { width:100%; border-collapse:collapse; } td, th { padding:6px; text-align:start; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; } td input { padding:6px 8px; min-width:60px; }
.thumb { width:46px; height:46px; border-radius:10px; background:var(--card2) center/cover; display:grid; place-items:center; font-size:26px; cursor:pointer; }
.qr { text-align:center; break-inside:avoid; } .qr img { width:100%; max-width:220px; border-radius:12px; background:#fff; } .qr h3 { margin:8px 0 2px; font-size:28px; }
.heat { display:grid; grid-template-columns:40px repeat(24,1fr); gap:2px; font-size:10px; } .heat i { aspect-ratio:1; border-radius:3px; display:grid; place-items:center; font-style:normal; color:#fff; font-size:9px; }
.sw { width:44px; height:44px; padding:0; border:0; background:none; } .row2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin-top:14px; }
@media (max-width:800px) { main { padding:14px; } aside button { white-space:nowrap; } .row2 { grid-template-columns:1fr !important; } .card { overflow-x:auto; } h1 { font-size:24px; } input[type=checkbox] { width:22px; height:22px; } }
@media print { aside, .noprint, .shell > main > h1 { display:none!important } .shell { display:block } body { background:#fff; color:#000 } .qr { color:#000 } .card { border:1px solid #ccc; background:#fff } }
</style></head>
<body><div class="shell"><aside>
<h2>⚙️ Admin</h2>
<button data-t="analytics">📊 Analytics</button><button data-t="menu">🍽️ Menu builder</button><button data-t="inventory">📦 Inventory</button><button data-t="floor">🪑 Floor plan</button><button data-t="staff">👥 Staff</button><button data-t="reports">📈 Reports</button><button data-t="theme">🎨 Theme & settings</button><button data-t="qr">🔳 Table QR codes</button><button data-t="audit">📜 Audit log</button>
<span style="flex:1"></span><button onclick="App.toggleLang()">🌐 EN / عربي</button><button onclick="App.toggleMode()">◐ Light / Dark</button><button onclick="App.logout()">⏻ Sign out</button></aside>
<main id="main"></main></div>
<script src="/vendor/sortable.js"></script><script src="/vendor/chart.js"></script><script src="/shared.js"></script>
<script>
let tab = App.ls('admintab') || 'analytics', cfgKey = '', actCat = null, days = 7, charts = [], A = null;
const api = (m, u, b) => fetch(u, { method: m, headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(r => r.json());
const $ = (s) => document.querySelector(s);
document.querySelectorAll('aside [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; App.ls('admintab', tab); cfgKey = ''; render(App.state, true); });
App.gate('admin', () => App.connect({ t: 'join', role: 'admin' }, { render(m) { render(m); } }));
function render(m, force) {
  if (!App.config) return;
  if (tab === 'floor' && (FP.dirty || FP.drag)) return;   // never rebuild the editor mid-edit
  document.querySelectorAll('aside [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const key = JSON.stringify(App.config) + App.lang + document.documentElement.dataset.dark + tab;
  if (key === cfgKey && !force) { if (tab === 'analytics') {} return; }   // ignore live-session noise
  cfgKey = key;
  const focus = document.activeElement; if (focus && focus.closest('#main') && focus.tagName === 'INPUT' && !force) return;  // don't clobber typing
  ({ analytics, menu, inventory: inventoryTab, floor: floorTab, staff: staffTab, reports: reportsTab, theme, qr, audit })[tab]();
}
App.handlers.render = (m) => render(m, true);

setInterval(() => { if (tab === 'analytics' || tab === 'audit') { cfgKey = ''; render(App.state, true); } }, 20000);
/* ---------------- Floor plan editor ---------------- */
let FP = { L: null, sel: null, dirty: false, drag: null, timer: null, v: 0 };
const DEC = { bar: ['🍸', 'Bar', 6, 2], kitchen: ['🍳', 'Kitchen', 4, 4], wall: ['🧱', 'Wall', 6, 1], plant: ['🪴', 'Plant', 2, 2], door: ['🚪', 'Door', 2, 2] };
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function floorTab() {
  const F = App.floor();
  if (!FP.dirty || !FP.L) FP.L = { tables: App.config.tables.map((t) => ({ id: t.id, number: t.number, shape: t.shape, seats: t.seats, ...App.tpos(t) })), decor: F.decor.map((d) => ({ ...d })) };
  $('#main').innerHTML = `<div class="spread"><h1>🪑 Floor plan</h1><span class="muted" id="fp-st"></span></div>
  <p class="muted" style="margin-top:-6px">Arrange the tables exactly like your café. Drag to move, pull the round handle to resize. Your captain sees this same map, scaled to fit any phone.</p>
  <div class="fp-tools"><button class="primary" onclick="fpAddTable()">+ Table</button>${Object.entries(DEC).map(([k, v]) => `<button class="ghost" onclick="fpAddDecor('${k}')">${v[0]} ${v[1]}</button>`).join('')}<button class="ghost" onclick="fpArrange()">✨ Auto-arrange</button></div>
  <div class="fp-layout"><div><div class="fl-stage edit" id="fp"></div></div><div class="card fp-side" id="fp-side"></div></div>`;
  fpDraw(); fpBind();
}
function fpItem(kind, id) { return kind === 't' ? FP.L.tables.find((x) => x.id === id) : kind === 'd' ? FP.L.decor.find((x) => x.id === id) : null; }
function fpDraw() {
  const F = App.floor(), st = $('#fp'); if (!st) return;
  st.style.setProperty('--cols', F.cols); st.style.setProperty('--rows', F.rows); st.style.aspectRatio = `${F.cols} / ${F.rows}`;
  const pos = (p) => `left:${p.fx / F.cols * 100}%;top:${p.fy / F.rows * 100}%;width:${p.fw / F.cols * 100}%;height:${p.fh / F.rows * 100}%;--m:${Math.min(p.fw, p.fh)}`;
  st.innerHTML = FP.L.decor.map((d) => `<div class="fl-d ${d.type} fp-el ${FP.sel === 'd:' + d.id ? 'sel' : ''}" data-k="d:${d.id}" style="${pos(d)}"><div>${App.decorIcon[d.type] || '▬'}${d.label ? `<small>${App.esc(d.label)}</small>` : ''}</div><i class="rzh"></i></div>`).join('')
    + FP.L.tables.map((t) => `<div class="fl-t ${t.shape} fp-el ${FP.sel === 't:' + t.id ? 'sel' : ''}" data-k="t:${t.id}" style="${pos(t)}">${App.chairs(t.shape, t.seats)}<span class="n">${t.number}</span><span class="s">${t.seats} seats</span><i class="rzh"></i></div>`).join('');
  fpInspector();
}
function fpInspector() {
  const box = $('#fp-side'); if (!box) return;
  const [kind, id] = (FP.sel || ':').split(':'), it = fpItem(kind, id);
  const step = (label, key, min) => `<div class="fp-step"><span>${label}</span><div class="c"><button onclick="fpAdj('${key}',-1,${min})">−</button><b>${it[key]}</b><button onclick="fpAdj('${key}',1,${min})">+</button></div></div>`;
  if (!it) { box.innerHTML = `<h3>Floor plan</h3><p class="muted">Tap a table or decor item to edit it.</p><p class="muted" style="font-size:13px">${FP.L.tables.length} tables · ${FP.L.tables.reduce((n, t) => n + t.seats, 0)} seats<br>Changes save automatically.</p>`; return; }
  if (kind === 't') box.innerHTML = `<h3>Table ${it.number}</h3><div class="muted" style="font-size:12px">Shape</div><div class="seg">${['round', 'square', 'long'].map((s) => `<button class="${it.shape === s ? 'on' : ''}" onclick="fpShape('${s}')">${{ round: '⚪ Round', square: '⬜ Square', long: '▭ Long' }[s]}</button>`).join('')}</div>
    ${step('Seats', 'seats', 1)}${step('Width', 'fw', 2)}${step('Height', 'fh', 2)}<button class="ghost" style="width:100%;margin-top:12px" onclick="fpDelete()">🗑 Remove table</button>`;
  else box.innerHTML = `<h3>${DEC[it.type][0]} ${DEC[it.type][1]}</h3><div class="muted" style="font-size:12px">Label</div><input value="${App.esc(it.label || '')}" maxlength="20" oninput="fpLabel(this.value)" style="margin:6px 0 10px">${step('Width', 'fw', 1)}${step('Height', 'fh', 1)}<button class="ghost" style="width:100%;margin-top:12px" onclick="fpDelete()">🗑 Remove</button>`;
}
function fpBind() {
  const st = $('#fp'); if (!st) return;
  st.onpointerdown = (e) => {
    const el = e.target.closest('.fp-el');
    if (!el) { FP.sel = null; st.querySelectorAll('.fp-el.sel').forEach((x) => x.classList.remove('sel')); fpInspector(); return; }
    const [kind, id] = el.dataset.k.split(':'), item = fpItem(kind, id); if (!item) return;
    FP.sel = el.dataset.k; st.querySelectorAll('.fp-el').forEach((x) => x.classList.toggle('sel', x === el)); fpInspector();
    const F = App.floor();
    FP.drag = { el, item, kind, mode: e.target.classList.contains('rzh') ? 'resize' : 'move', x: e.clientX, y: e.clientY, o: { ...item }, cw: st.getBoundingClientRect().width / F.cols, F, moved: false };
    st.setPointerCapture(e.pointerId); e.preventDefault();
  };
  st.onpointermove = (e) => {
    const d = FP.drag; if (!d) return;
    const dx = Math.round(((e.clientX - d.x) / d.cw) * 2) / 2, dy = Math.round(((e.clientY - d.y) / d.cw) * 2) / 2, it = d.item, F = d.F, min = d.kind === 't' ? 2 : 1;
    if (!d.moved && !dx && !dy) return;
    d.moved = true;
    if (d.mode === 'move') { it.fx = clampN(d.o.fx + dx, 0, F.cols - it.fw); it.fy = clampN(d.o.fy + dy, 0, F.rows - it.fh); }
    else { it.fw = clampN(d.o.fw + dx, min, F.cols - it.fx); it.fh = clampN(d.o.fh + dy, min, F.rows - it.fy); if (d.kind === 't' && it.shape === 'round') { const sz = Math.min(Math.max(min, Math.max(d.o.fw + dx, d.o.fh + dy)), Math.min(F.cols - it.fx, F.rows - it.fy)); it.fw = it.fh = sz; } }
    d.el.style.left = it.fx / F.cols * 100 + '%'; d.el.style.top = it.fy / F.rows * 100 + '%'; d.el.style.width = it.fw / F.cols * 100 + '%'; d.el.style.height = it.fh / F.rows * 100 + '%'; d.el.style.setProperty('--m', Math.min(it.fw, it.fh));
  };
  st.onpointerup = st.onpointercancel = () => { const d = FP.drag; if (!d) return; FP.drag = null; if (d.moved) { FP.dirty = true; FP.v++; fpSaveSoon(); } fpDraw(); };
}
function fpSaveSoon() { const s = $('#fp-st'); if (s) s.textContent = 'Saving…'; clearTimeout(FP.timer); FP.timer = setTimeout(fpSave, 500); }
async function fpSave() {
  clearTimeout(FP.timer); const v = FP.v;
  await api('PUT', '/api/layout', { tables: FP.L.tables, decor: FP.L.decor });
  if (FP.v === v) FP.dirty = false; const s = $('#fp-st'); if (s) s.textContent = 'Saved ✓';
}
function fpTouch() { FP.dirty = true; FP.v++; fpDraw(); fpSaveSoon(); }
function fpAdj(key, d, min) { const it = fpItem(...FP.sel.split(':')); if (!it) return; const F = App.floor(); const lim = key === 'seats' ? 20 : key === 'fw' ? F.cols - it.fx : F.rows - it.fy; it[key] = clampN(it[key] + d, min, lim); if (it.shape === 'round' && (key === 'fw' || key === 'fh')) it.fw = it.fh = it[key]; fpTouch(); }
function fpShape(s) { const it = fpItem(...FP.sel.split(':')); if (!it) return; it.shape = s; if (s === 'round') it.fw = it.fh = Math.max(2, Math.round((it.fw + it.fh) / 2)); if (s === 'long' && it.fw <= it.fh) it.fw = Math.min(App.floor().cols - it.fx, it.fh + 2); fpTouch(); }
function fpLabel(v) { const it = fpItem(...FP.sel.split(':')); if (!it) return; it.label = v; FP.dirty = true; FP.v++; fpSaveSoon(); const el = $(`#fp [data-k="${FP.sel}"] > div`); if (el) el.innerHTML = (App.decorIcon[it.type] || '▬') + (v ? `<small>${App.esc(v)}</small>` : ''); }
function fpFree(w, h) { const F = App.floor(), all = [...FP.L.tables, ...FP.L.decor]; for (let y = 0; y <= F.rows - h; y++) for (let x = 0; x <= F.cols - w; x++) if (!all.some((o) => x < o.fx + o.fw && x + w > o.fx && y < o.fy + o.fh && y + h > o.fy)) return { fx: x, fy: y }; return { fx: 0, fy: 0 }; }
async function refreshCfg() { App.config = await api('GET', '/api/config'); cfgKey = ''; render(App.state, true); }
async function fpAddTable() { if (FP.dirty) await fpSave(); const t = await api('POST', '/api/tables'); FP.sel = 't:' + t.id; FP.dirty = false; await refreshCfg(); }
function fpAddDecor(type) { const [, , w, h] = DEC[type]; FP.L.decor.push({ id: 'd' + Date.now().toString(36), type, ...fpFree(w, h), fw: w, fh: h, label: DEC[type][1] === 'Plant' || type === 'wall' ? '' : DEC[type][1] }); FP.sel = 'd:' + FP.L.decor[FP.L.decor.length - 1].id; fpTouch(); }
async function fpDelete() {
  const [kind, id] = FP.sel.split(':'), it = fpItem(kind, id); if (!it) return;
  if (kind === 'd') { FP.L.decor = FP.L.decor.filter((x) => x.id !== id); FP.sel = null; return fpTouch(); }
  if (!confirm('Remove table ' + it.number + '? Its QR code will stop working.')) return;
  if (FP.dirty) await fpSave(); await api('DELETE', '/api/tables/' + id); FP.sel = null; FP.dirty = false; await refreshCfg();
}
function fpArrange() {
  const F = App.floor(); let x = 0, y = 0, rowH = 0;
  FP.L.tables.slice().sort((a, b) => a.number - b.number).forEach((t) => { if (x + t.fw > F.cols - 2) { x = 0; y += rowH + 1; rowH = 0; } t.fx = x; t.fy = Math.min(y, F.rows - t.fh); x += t.fw + 2; rowH = Math.max(rowH, t.fh); });
  fpTouch();
}

/* ---------------- Staff ---------------- */
async function staffTab() {
  const d = await api('GET', '/api/staff'), roles = { captain: '🧑‍✈️ Captain / floor', kitchen: '👨‍🍳 Kitchen' };
  const fmt = (x) => x.handled ? Math.round(x.respMs / x.handled / 1000) + 's' : '-';
  $('#main').innerHTML = `<h1>👥 Staff</h1><p class="muted" style="margin-top:-8px">Each person gets their own PIN, so every action is logged under their name and you can see who is fast.</p>
  <div class="row2" style="grid-template-columns:minmax(300px,1.2fr) minmax(260px,1fr);align-items:start">
  <div class="card" style="overflow:auto"><h3>Team</h3>
   <table><tr><th>Name</th><th>Role</th><th>New PIN</th><th>Active</th><th></th></tr>
   ${d.staff.map((x) => `<tr><td><input value="${App.esc(x.name)}" style="min-width:110px" onchange="stf('${x.id}',{name:this.value})"></td><td><select onchange="stf('${x.id}',{role:this.value})"><option value="captain" ${x.role === 'captain' ? 'selected' : ''}>${roles.captain}</option><option value="kitchen" ${x.role === 'kitchen' ? 'selected' : ''}>${roles.kitchen}</option></select></td>
    <td><input placeholder="••••" inputmode="numeric" maxlength="8" style="width:90px" onchange="if(this.value)stf('${x.id}',{pin:this.value}).then(()=>this.value='')"></td><td><input type="checkbox" style="width:22px;height:22px" ${x.active === false ? '' : 'checked'} onchange="stf('${x.id}',{active:this.checked})"></td><td><button class="ghost" onclick="if(confirm('Remove ${App.esc(x.name)}?'))api('DELETE','/api/staff/${x.id}').then(()=>{cfgKey='';render(App.state,true)})">🗑</button></td></tr>`).join('') || '<tr><td colspan="5" class="muted">No staff accounts yet - add the first one below.</td></tr>'}</table>
   <h3 style="margin-top:18px">Add a team member</h3><div class="row wrap"><input id="sn" placeholder="Name" style="max-width:170px"><select id="sr" style="max-width:190px"><option value="captain">${roles.captain}</option><option value="kitchen">${roles.kitchen}</option></select><input id="sp" placeholder="PIN (4-8 digits)" inputmode="numeric" maxlength="8" style="max-width:150px"><button class="ghost" onclick="$('#sp').value=String(Math.floor(1000+Math.random()*9000))">🎲</button><button class="primary" onclick="addStaff()">Add</button></div>
   <p class="muted" style="font-size:12.5px;margin-top:12px">Captains sign in at <b>/captain</b>, kitchen staff at <b>/kitchen</b>. The old shared PIN (${App.esc(d.legacyPin)}) still works as "Captain" - change it under Theme & settings or stop using it once everyone has their own.</p></div>
  <div class="card" style="overflow:auto"><h3>Performance</h3><table><tr><th>Name</th><th>Requests</th><th>Avg reply</th><th>Started</th><th>Served</th><th>Closed</th></tr>
   ${Object.values(d.stats).map((x) => `<tr><td><b>${App.esc(x.name)}</b></td><td>${x.handled || 0}</td><td>${fmt(x)}</td><td>${x.started || 0}</td><td>${x.served || 0}</td><td>${x.closed || 0}</td></tr>`).join('') || '<tr><td colspan="6" class="muted">Numbers appear once staff start handling tables.</td></tr>'}</table></div></div>`;
}
async function stf(id, body) { const r = await api('PUT', '/api/staff/' + id, body); App.toast(r.error || 'Saved'); return r; }
async function addStaff() { const r = await api('POST', '/api/staff', { name: $('#sn').value, role: $('#sr').value, pin: $('#sp').value }); if (r.error) return App.toast(r.error); App.toast('Added ' + r.name); cfgKey = ''; render(App.state, true); }

/* ---------------- Reports ---------------- */
let RP = { preset: 'today', from: null, to: null }, RC = [];
function rpPrint(i) {
  const h = RC[i]; if (!h) return;
  App.printHTML(App.receiptHTML({ label: h.tableNumber, kind: h.kind, customer: h.customer, at: h.closedAt, items: h.items, gross: h.sub, discount: h.discount, discountNote: h.discountNote, service: h.service, tax: h.tax, tip: h.tip, total: h.total, method: h.method, pay: h.pay, by: h.closedBy }));
}
function rpRange() {
  const d0 = new Date(); d0.setHours(0, 0, 0, 0); const day = 86400000, t0 = d0.getTime();
  if (RP.preset === 'today') return [t0, Date.now()]; if (RP.preset === 'yesterday') return [t0 - day, t0 - 1];
  if (RP.preset === '7') return [t0 - 6 * day, Date.now()]; if (RP.preset === '30') return [t0 - 29 * day, Date.now()];
  const f = RP.from ? new Date(RP.from + 'T00:00:00').getTime() : t0, t = RP.to ? new Date(RP.to + 'T23:59:59').getTime() : Date.now(); return [f, t];
}
async function reportsTab() {
  const [f, t] = rpRange(), r = await api('GET', `/api/report?from=${f}&to=${t}`), fb = (await api('GET', '/api/feedback')).reviews || []; RC = (await api('GET', '/api/receipts')).receipts || [];
  const K = (l, v, sub) => `<div class="card kpi"><span>${l}</span><b>${v}</b>${sub ? `<small class="muted">${sub}</small>` : ''}</div>`, tk = App.tok('admin');
  const chip = (k, l) => `<button class="${RP.preset === k ? 'sel' : ''}" onclick="RP.preset='${k}';reportsTab()">${l}</button>`;
  $('#main').innerHTML = `<div class="spread wrap"><h1>📈 Reports</h1><div class="row wrap noprint">${chip('today', 'Today')}${chip('yesterday', 'Yesterday')}${chip('7', '7 days')}${chip('30', '30 days')}<input type="date" style="width:150px" value="${RP.from || ''}" onchange="RP.preset='c';RP.from=this.value;reportsTab()"><input type="date" style="width:150px" value="${RP.to || ''}" onchange="RP.preset='c';RP.to=this.value;reportsTab()"></div></div>
  <div class="row wrap noprint" style="margin:6px 0 14px"><a href="/api/r/${App.slug}/report.xlsx?from=${f}&to=${t}&token=${tk}"><button class="primary">⬇ Excel report</button></a><button class="ghost" onclick="window.print()">🖨 Print / PDF</button><a href="/api/r/${App.slug}/export.json?token=${tk}"><button class="ghost">💾 Backup all data</button></a></div>
  <div class="muted" style="margin-bottom:10px">${new Date(f).toLocaleString()} → ${new Date(t).toLocaleString()}</div>
  <div class="grid">${K('Table sessions', r.sessions, r.guests + ' guests')}${K('Gross sales', App.money(r.gross))}${K('Service charge', App.money(r.service))}${K('Tax collected', App.money(r.tax))}${K('Tips', App.money(r.tips))}${K('Total collected', App.money(r.total), 'avg ticket ' + App.money(r.avgTicket))}${K('Cash', App.money(r.methods.cash || 0))}${K('Card', App.money(r.methods.card || 0))}${K('Discounts given', App.money(r.discounts || 0))}${K('Voided items', (r.voids || {}).count || 0, App.money((r.voids || {}).value || 0) + ((r.voids || {}).waste ? ' · wasted ' + App.money(r.voids.waste) : ''))}${K('Est. profit', App.money(r.profit || 0), 'after cost of goods and discounts')}${K('Guest rating', r.reviews.count ? '⭐ ' + r.reviews.avg.toFixed(1) : '-', r.reviews.count + ' ratings' + (r.reviews.low ? ' · ' + r.reviews.low + ' low' : ''))}</div>

  const kpi = (l, v) => `<div class="card kpi"><span>${l}</span><b>${v}</b></div>`;
  $('#main').innerHTML = `<div class="spread"><h1>📊 Analytics</h1><div class="row">${[1, 7, 30].map(d => `<button class="${days === d ? 'sel' : ''}" onclick="days=${d};cfgKey='';render(App.state,true)">${d === 1 ? 'Today+' : d + ' days'}</button>`).join('')}</div></div>
  <div class="grid">${kpi('Gross sales', App.money(r.gross))}${kpi('Taxes collected', App.money(r.tax))}${kpi('Service charges', App.money(r.service))}${kpi('Tips', App.money(r.tips))}${kpi('Cash / Card', App.money(r.cash) + '<br><small>' + App.money(r.card) + '</small>')}${kpi('Table sessions', r.sessions)}</div>
  <div class="grid" style="margin-top:14px">${kpi('Avg. table occupied', Math.round(tv.avgOccupiedMin) + ' min')}${kpi('Avg. empty gap', Math.round(tv.avgEmptyGapMin) + ' min')}${kpi('Turnover / table / day', tv.turnsPerTablePerDay.toFixed(1) + '×')}${kpi('Occupancy', tv.occupancyPct.toFixed(0) + '%')}</div>
  <div class="row2"><div class="card"><h3>Revenue per day</h3><canvas id="c1"></canvas></div><div class="card"><h3>Revenue breakdown</h3><canvas id="c2"></canvas></div>
  <div class="card"><h3>Top-selling items (qty)</h3><canvas id="c3"></canvas></div><div class="card"><h3>Category revenue vs profit</h3><canvas id="c4"></canvas></div></div>
  <div class="card" style="margin-top:14px;overflow:auto"><h3>Rush hours heatmap (session starts)</h3><div id="heat" style="min-width:640px"></div></div>
  <div class="card" style="margin-top:14px"><h3>Table usage</h3><canvas id="c5" height="80"></canvas></div>`;
  charts.forEach(c => c.destroy()); charts = [];
  const cs = getComputedStyle(document.documentElement), ac = cs.getPropertyValue('--accent').trim(), ac2 = cs.getPropertyValue('--accent2').trim(), tx = cs.getPropertyValue('--text').trim();
  Chart.defaults.color = tx; Chart.defaults.borderColor = 'rgba(128,128,128,.2)';
  const mk = (id, cfg) => charts.push(new Chart($(id), cfg));
  const dk = Object.keys(A.daily).sort();
  mk('#c1', { type: 'line', data: { labels: dk.map(d => d.slice(5)), datasets: [{ data: dk.map(k => Math.round(A.daily[k])), borderColor: ac, backgroundColor: ac + '33', fill: true, tension: .35 }] }, options: { plugins: { legend: { display: false } } } });
  mk('#c2', { type: 'doughnut', data: { labels: ['Net sales', 'Service', 'Tax', 'Tips'], datasets: [{ data: [r.gross, r.service, r.tax, r.tips].map(Math.round), backgroundColor: [ac, ac2, '#3b82f6', '#2ecc71'], borderWidth: 0 }] } });
  mk('#c3', { type: 'bar', data: { labels: A.topItems.map(i => i.name), datasets: [{ data: A.topItems.map(i => i.qty), backgroundColor: ac, borderRadius: 6 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  mk('#c4', { type: 'bar', data: { labels: A.categories.map(c => c.name), datasets: [{ label: 'Revenue', data: A.categories.map(c => Math.round(c.revenue)), backgroundColor: ac2, borderRadius: 6 }, { label: 'Profit', data: A.categories.map(c => Math.round(c.profit)), backgroundColor: ac, borderRadius: 6 }] } });
  const T = App.config.tables.map(t => t.number);
  mk('#c5', { type: 'bar', data: { labels: T.map(n => 'T' + n), datasets: [{ data: T.map(n => A.perTable[n] || 0), backgroundColor: ac, borderRadius: 4 }] }, options: { plugins: { legend: { display: false } } } });
  const max = Math.max(1, ...A.heat.flat()), D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let h = '<div class="heat"><span></span>' + Array.from({ length: 24 }, (_, i) => `<span style="text-align:center">${i}</span>`).join('');
  A.heat.forEach((row, d) => { h += `<span>${D[d]}</span>` + row.map((v, hr) => `<i title="${D[d]} ${hr}:00 — ${v}" style="background:${v ? ac : 'var(--card2)'};opacity:${v ? 0.2 + 0.8 * v / max : 1}">${v || ''}</i>`).join(''); });
  $('#heat').innerHTML = h + '</div>';
}

/* ---------------- Audit ---------------- */
async function audit() {
  const a = await api('GET', '/api/analytics?days=30');
  const f = (ts) => ts ? new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  $('#main').innerHTML = `<h1>📜 Order audit log</h1><div class="card" style="overflow:auto"><table><tr><th>Table</th><th>Entered</th><th>First order</th><th>Check requested</th><th>Cleared</th><th>Guests</th><th>Payment</th><th>Total</th></tr>
  ${a.audit.map(r => `<tr><td><b>${r.tableNumber}</b> ${r.live ? '<span class="pill" style="color:var(--ok)">LIVE</span>' : ''}</td><td>${f(r.startedAt)}</td><td>${f(r.orderedAt)}</td><td>${f(r.checkAt)}</td><td>${r.live ? 'occupied' : f(r.closedAt)}</td><td>${r.guests}</td><td>${r.method}</td><td>${App.money(r.total)}</td></tr>`).join('')}</table></div>`;
}
