<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Dashboard</title><link rel="stylesheet" href="/shared.css">
<style>
.shell { display:grid; grid-template-columns:220px 1fr; min-height:100vh; } @media (max-width:800px){ .shell{grid-template-columns:1fr} aside{flex-direction:row!important;overflow:auto} }
aside { background:var(--card); border-inline-end:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:6px; position:sticky; top:0; height:100vh; }
@media (max-width:800px){ aside{height:auto;position:static} }
aside h2 { margin:0 8px 14px; font-size:18px; } aside button { text-align:start; background:none; } aside button.on { background:color-mix(in srgb,var(--accent) 20%,transparent); color:var(--accent); font-weight:700; }
main { padding:24px; overflow:auto; max-width:1200px; } h1 { margin-top:0; }
.grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); }
.kpi b { display:block; font-size:26px; margin-top:4px; } .kpi span { color:var(--muted); font-size:13px; }
.cat { display:flex; gap:8px; align-items:center; padding:8px; border:1px solid var(--line); border-radius:12px; margin-bottom:6px; background:var(--card2); }
.cat .h { cursor:grab; padding:4px 8px; } .cat.act { outline:2px solid var(--accent); }
.cat input { padding:6px 8px; } .sortable-ghost { opacity:.35; }
table { width:100%; border-collapse:collapse; } td, th { padding:6px; text-align:start; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; } td input { padding:6px 8px; min-width:60px; }
.thumb { width:46px; height:46px; border-radius:10px; background:var(--card2) center/cover; display:grid; place-items:center; font-size:26px; cursor:pointer; }
.qr { text-align:center; break-inside:avoid; } .qr img { width:100%; max-width:220px; border-radius:12px; background:#fff; } .qr h3 { margin:8px 0 2px; font-size:28px; }
.heat { display:grid; grid-template-columns:40px repeat(24,1fr); gap:2px; font-size:10px; } .heat i { aspect-ratio:1; border-radius:3px; display:grid; place-items:center; font-style:normal; color:#fff; font-size:9px; }
.sw { width:44px; height:44px; padding:0; border:0; background:none; } .row2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:14px; margin-top:14px; }
@media print { aside, .noprint, .shell > main > h1 { display:none!important } .shell { display:block } body { background:#fff; color:#000 } .qr { color:#000 } .card { border:1px solid #ccc; background:#fff } }
</style></head>
<body><div class="shell"><aside>
<h2>⚙️ Admin</h2>
<button data-t="analytics">📊 Analytics</button><button data-t="menu">🍽️ Menu builder</button><button data-t="theme">🎨 Theme & settings</button><button data-t="qr">🔳 Table QR codes</button><button data-t="audit">📜 Audit log</button>
<span style="flex:1"></span><button onclick="App.toggleLang()">🌐 EN / عربي</button><button onclick="App.toggleMode()">◐ Light / Dark</button><a href="/" style="padding:10px;color:var(--accent)">← Home</a></aside>
<main id="main"></main></div>
<script src="/vendor/sortable.js"></script><script src="/vendor/chart.js"></script><script src="/shared.js"></script>
<script>
let tab = App.ls('admintab') || 'analytics', cfgKey = '', actCat = null, days = 7, charts = [], A = null;
const api = (m, u, b) => fetch(u, { method: m, headers: { 'Content-Type': 'application/json' }, body: b ? JSON.stringify(b) : undefined }).then(r => r.json());
const $ = (s) => document.querySelector(s);
document.querySelectorAll('aside [data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; App.ls('admintab', tab); cfgKey = ''; render(App.state, true); });
App.connect({ t: 'join', role: 'admin' }, { render(m) { render(m); } });
function render(m, force) {
  if (!App.config) return;
  document.querySelectorAll('aside [data-t]').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const key = JSON.stringify(App.config) + App.lang + document.documentElement.dataset.dark + tab;
  if (key === cfgKey && !force) { if (tab === 'analytics') {} return; }   // ignore live-session noise
  cfgKey = key;
  const focus = document.activeElement; if (focus && focus.closest('#main') && focus.tagName === 'INPUT' && !force) return;  // don't clobber typing
  ({ analytics, menu, theme, qr, audit })[tab]();
}
App.handlers.render = (m) => render(m, true);

setInterval(() => { if (tab === 'analytics' || tab === 'audit') { cfgKey = ''; render(App.state, true); } }, 20000);
/* ---------------- Menu builder ---------------- */
function menu() {
  const { categories: C, items: I } = App.config;
  if (!actCat || !C.find(c => c.id === actCat)) actCat = C[0]?.id;
  const its = I.filter(i => i.cat === actCat);
  $('#main').innerHTML = `<h1>🍽️ Menu builder</h1>
  <div class="row2" style="grid-template-columns:minmax(280px,340px) 1fr;align-items:start">
  <div class="card"><h3>Categories <small class="muted">(drag ⠿ to reorder)</small></h3><div id="cats">${C.map(c => `<div class="cat ${c.id === actCat ? 'act' : ''}" data-id="${c.id}"><span class="h">⠿</span>
   <input style="width:42px;text-align:center" value="${App.esc(c.emoji)}" onchange="upd('categories','${c.id}',{emoji:this.value})"><input value="${App.esc(c.name)}" onchange="upd('categories','${c.id}',{name:this.value})"><input dir="rtl" value="${App.esc(c.name_ar)}" onchange="upd('categories','${c.id}',{name_ar:this.value})">
   <button class="ghost" onclick="actCat='${c.id}';cfgKey='';render(App.state,true)">▶</button><button class="ghost" onclick="if(confirm('Delete category and its items?'))api('DELETE','/api/categories/${c.id}')">🗑</button></div>`).join('')}</div>
   <button class="primary" onclick="api('POST','/api/categories',{name:'New category'})">+ Category</button>
   <hr style="border-color:var(--line);margin:16px 0"><h3>Bulk upload</h3><p class="muted" style="font-size:13px">Excel/CSV columns: category, category_ar, name, name_ar, price, cost, emoji, description</p>
   <input type="file" id="imp" accept=".xlsx,.xls,.csv"><div class="row" style="margin-top:8px"><button class="primary" onclick="importFile()">Upload</button><a href="/api/menu/template.xlsx" style="color:var(--accent)">⬇ Template</a></div></div>
  <div class="card" style="overflow:auto"><div class="spread"><h3>Items in “${App.esc(C.find(c => c.id === actCat)?.name || '')}”</h3><button class="primary" onclick="api('POST','/api/items',{cat:'${actCat}'})">+ Item</button></div>
  <table><tr><th></th><th>Name</th><th>الاسم</th><th>Price</th><th>Cost</th><th>Emoji</th><th>Description</th><th></th></tr>
  ${its.map(i => `<tr><td><div class="thumb" style="${i.img ? `background-image:url(${i.img})` : ''}" title="Upload image" onclick="pick('${i.id}')">${i.img ? '' : i.emoji}</div></td>
   <td><input value="${App.esc(i.name)}" onchange="upd('items','${i.id}',{name:this.value})"></td><td><input dir="rtl" value="${App.esc(i.name_ar)}" onchange="upd('items','${i.id}',{name_ar:this.value})"></td>
   <td><input type="number" style="width:80px" value="${i.price}" onchange="upd('items','${i.id}',{price:this.value})"></td><td><input type="number" style="width:70px" value="${i.cost}" onchange="upd('items','${i.id}',{cost:this.value})"></td>
   <td><input style="width:56px" value="${App.esc(i.emoji)}" onchange="upd('items','${i.id}',{emoji:this.value})"></td><td><input value="${App.esc(i.desc)}" onchange="upd('items','${i.id}',{desc:this.value})"></td>
   <td><select style="width:90px" onchange="upd('items','${i.id}',{cat:this.value})">${C.map(c => `<option value="${c.id}" ${c.id === i.cat ? 'selected' : ''}>${c.emoji}</option>`).join('')}</select> <button class="ghost" onclick="api('DELETE','/api/items/${i.id}')">🗑</button></td></tr>`).join('')}</table></div></div>
  <input type="file" id="imgin" accept="image/*" hidden>`;
  Sortable.create($('#cats'), { handle: '.h', animation: 180, onEnd: () => api('PUT', '/api/categories/order', { ids: [...document.querySelectorAll('#cats .cat')].map(e => e.dataset.id) }) });
}
function upd(kind, id, body) { api('PUT', `/api/${kind}/${id}`, body); }
function pick(id) { const f = $('#imgin'); f.onchange = async () => { const fd = new FormData(); fd.append('image', f.files[0]); await fetch(`/api/items/${id}/image`, { method: 'POST', body: fd }); }; f.click(); }
async function importFile() {
  const f = $('#imp').files[0]; if (!f) return App.toast('Choose a file first');
  const fd = new FormData(); fd.append('file', f);
  const r = await (await fetch('/api/menu/import', { method: 'POST', body: fd })).json();
  App.toast(r.error || `Imported ${r.added} items`);
}

/* ---------------- Theme & settings ---------------- */
function theme() {
  const s = App.config.settings, p = s.palette;
  const sw = (k, label) => `<label style="text-align:center;font-size:12px" class="muted"><input class="sw" type="color" value="${p[k]}" onchange="setPal('${k}',this.value)"><br>${label}</label>`;
  $('#main').innerHTML = `<h1>🎨 Theme & settings</h1><div class="row2">
  <div class="card"><h3>Theme (applies live to every screen)</h3><div class="row wrap">
   ${[['dark', '🌙 Dark café'], ['pink', '🌸 Modern pink'], ['white', '⬜ Minimalist white'], ['custom', '🎨 Custom']].map(([k, l]) => `<button class="${s.theme === k ? 'sel' : ''}" onclick="api('POST','/api/settings',{theme:'${k}'})">${l}</button>`).join('')}</div>
   <p class="muted">Custom palette</p><div class="row wrap">${sw('accent', 'Accent')}${sw('accent2', 'Accent 2')}${sw('bg', 'Background')}${sw('card', 'Cards')}${sw('text', 'Text')}</div>
   <p class="muted">Default language</p><div class="row"><button class="${s.lang === 'en' ? 'sel' : ''}" onclick="api('POST','/api/settings',{lang:'en'});App.ls('lang','en')">English (LTR)</button><button class="${s.lang === 'ar' ? 'sel' : ''}" onclick="api('POST','/api/settings',{lang:'ar'});App.ls('lang','ar')">العربية (RTL)</button></div>
   <p class="muted" style="font-size:12px">Guests and staff can also toggle light/dark and language on their own device.</p></div>
  <div class="card"><h3>Business</h3>
   <label class="muted">Name (EN)</label><input value="${App.esc(s.name)}" onchange="api('POST','/api/settings',{name:this.value})">
   <label class="muted">الاسم (AR)</label><input dir="rtl" value="${App.esc(s.name_ar)}" onchange="api('POST','/api/settings',{name_ar:this.value})">
   <div class="grid" style="margin-top:8px"><div><label class="muted">Tax %</label><input type="number" value="${s.tax}" onchange="api('POST','/api/settings',{tax:+this.value})"></div><div><label class="muted">Service %</label><input type="number" value="${s.service}" onchange="api('POST','/api/settings',{service:+this.value})"></div><div><label class="muted">Currency</label><input value="${App.esc(s.currency)}" onchange="api('POST','/api/settings',{currency:this.value})"></div></div></div></div>`;
}
function setPal(k, v) { const p = { ...App.config.settings.palette, [k]: v }; api('POST', '/api/settings', { palette: p, theme: 'custom' }); }

/* ---------------- QR codes ---------------- */
async function qr() {
  const info = await api('GET', '/api/info');
  const base = App.ls('qrbase') || info.base;
  const T = App.config.tables;
  $('#main').innerHTML = `<h1>🔳 Table QR codes</h1><div class="card noprint spread wrap" style="margin-bottom:14px"><div style="flex:1;min-width:260px"><label class="muted">Public base URL (use your LAN IP so phones can reach it, or your deployed domain)</label><input id="qrbase" value="${App.esc(base)}"></div>
  <div class="row"><button class="primary" onclick="App.ls('qrbase',$('#qrbase').value);cfgKey='';render(App.state,true)">Apply</button><button class="primary" onclick="window.print()">🖨 Print / Save as PDF</button><button class="ghost" onclick="api('POST','/api/tables')">+ Table</button></div></div>
  <div class="grid">${T.map(t => `<div class="card qr"><img src="/api/qr/${t.number}.png?base=${encodeURIComponent(base)}" alt="QR ${t.number}"><h3>${App.tr('table')} ${t.number}</h3><div class="muted" style="font-size:12px">${App.esc(base)}/t/${t.number}</div>
   <div class="row noprint" style="justify-content:center;margin-top:8px"><a href="/api/qr/${t.number}.png?base=${encodeURIComponent(base)}" download="table-${t.number}-qr.png"><button class="ghost">⬇ PNG</button></a><a href="/t/${t.number}" target="_blank"><button class="ghost">Open</button></a><button class="ghost" onclick="if(confirm('Remove table ${t.number}?'))api('DELETE','/api/tables/${t.id}')">🗑</button></div></div>`).join('')}</div>`;
}

/* ---------------- Analytics ---------------- */
async function analytics() {
  A = await api('GET', '/api/analytics?days=' + days);
  const r = A.revenue, tv = A.turnover;
  const kpi = (l, v) => `<div class="card kpi"><span>${l}</span><b>${v}</b></div>`;
  $('#main').innerHTML = `<div class="spread"><h1>📊 Analytics</h1><div class="row">${[1, 7, 30].map(d => `<button class="${days === d ? 'sel' : ''}" onclick="days=${d};cfgKey='';render(App.state,true)">${d === 1 ? 'Today+' : d + ' days'}</button>`).join('')}</div></div>
  <div class="grid">${kpi('Gross sales', App.money(r.gross))}${kpi('Taxes collected', App.money(r.tax))}${kpi('Service charges', App.money(r.service))}${kpi('Tips', App.money(r.tips))}${kpi('Cash / Card', App.money(r.cash) + '<br><small>' + App.money(r.card) + '</small>')}${kpi('Table sessions', r.sessions)}</div>
  <div class="grid" style="margin-top:14px">${kpi('Avg. table occupied', Math.round(tv.avgOccupiedMin) + ' min')}${kpi('Avg. empty gap', Math.round(tv.avgEmptyGapMin) + ' min')}${kpi('Turnover / table / day', tv.turnsPerTablePerDay.toFixed(1) + '×')}${kpi('Occupancy', tv.occupancyPct.toFixed(0) + '%')}</div>
  <div class="row2"><div class="card"><h3>Revenue per day</h3><canvas id="c1"></canvas></div><div class="card"><h3>Revenue breakdown</h3><canvas id="c2"></canvas></div>
  <div class="card"><h3>Top-selling items (qty)</h3><canvas id="c3"></canvas></div><div class="card"><h3>Category revenue vs profit</h3><canvas id="c4"></canvas></div></div>
  <div class="card" style="margin-top:14px;overflow:auto"><h3>Rush hours heatmap (session starts)</h3><div id="heat" style="min-width:640px"></div></div>
  <div class="card" style="margin-top:14px"><h3>Table usage</h3><canvas id="c5" height="80"></canvas></div>`;
  charts.forEach(c => c.destroy()); charts = [];
  const cs = getComputedStyle(document.documentElement), ac = cs.getPropertyValue('--accent').trim(), ac2 = cs.getPropertyValue('--accent2').trim(), tx = cs.getPropertyValue('--text').trim();
  Chart.defaults.color = tx; Chart.defaults.borderColor = 'rgba(128,128,128,.2)';
  const mk = (id, cfg) => charts.push(new Chart($(id), cfg));
  const dk = Object.keys(A.daily).sort();
  mk('#c1', { type: 'line', data: { labels: dk.map(d => d.slice(5)), datasets: [{ data: dk.map(k => Math.round(A.daily[k])), borderColor: ac, backgroundColor: ac + '33', fill: true, tension: .35 }] }, options: { plugins: { legend: { display: false } } } });
  mk('#c2', { type: 'doughnut', data: { labels: ['Net sales', 'Service', 'Tax', 'Tips'], datasets: [{ data: [r.gross, r.service, r.tax, r.tips].map(Math.round), backgroundColor: [ac, ac2, '#3b82f6', '#2ecc71'], borderWidth: 0 }] } });
  mk('#c3', { type: 'bar', data: { labels: A.topItems.map(i => i.name), datasets: [{ data: A.topItems.map(i => i.qty), backgroundColor: ac, borderRadius: 6 }] }, options: { indexAxis: 'y', plugins: { legend: { display: false } } } });
  mk('#c4', { type: 'bar', data: { labels: A.categories.map(c => c.name), datasets: [{ label: 'Revenue', data: A.categories.map(c => Math.round(c.revenue)), backgroundColor: ac2, borderRadius: 6 }, { label: 'Profit', data: A.categories.map(c => Math.round(c.profit)), backgroundColor: ac, borderRadius: 6 }] } });
  const T = App.config.tables.map(t => t.number);
  mk('#c5', { type: 'bar', data: { labels: T.map(n => 'T' + n), datasets: [{ data: T.map(n => A.perTable[n] || 0), backgroundColor: ac, borderRadius: 4 }] }, options: { plugins: { legend: { display: false } } } });
  const max = Math.max(1, ...A.heat.flat()), D = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  let h = '<div class="heat"><span></span>' + Array.from({ length: 24 }, (_, i) => `<span style="text-align:center">${i}</span>`).join('');
  A.heat.forEach((row, d) => { h += `<span>${D[d]}</span>` + row.map((v, hr) => `<i title="${D[d]} ${hr}:00 — ${v}" style="background:${v ? ac : 'var(--card2)'};opacity:${v ? 0.2 + 0.8 * v / max : 1}">${v || ''}</i>`).join(''); });
  $('#heat').innerHTML = h + '</div>';
}

/* ---------------- Audit ---------------- */
async function audit() {
  const a = await api('GET', '/api/analytics?days=30');
  const f = (ts) => ts ? new Date(ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
  $('#main').innerHTML = `<h1>📜 Order audit log</h1><div class="card" style="overflow:auto"><table><tr><th>Table</th><th>Entered</th><th>First order</th><th>Check requested</th><th>Cleared</th><th>Guests</th><th>Payment</th><th>Total</th></tr>
  ${a.audit.map(r => `<tr><td><b>${r.tableNumber}</b> ${r.live ? '<span class="pill" style="color:var(--ok)">LIVE</span>' : ''}</td><td>${f(r.startedAt)}</td><td>${f(r.orderedAt)}</td><td>${f(r.checkAt)}</td><td>${r.live ? 'occupied' : f(r.closedAt)}</td><td>${r.guests}</td><td>${r.method}</td><td>${App.money(r.total)}</td></tr>`).join('')}</table></div>`;
}
</script></body></html>
