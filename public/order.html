  const drv = isDl && d && d.driver && (st === 'out' || st === 'ready') ? `<div class="card drv"><b>🛵 ${t('driverH')}: ${esc(d.driver)}</b>${d.pos && st === 'out' ? `<p style="margin:6px 0 0">${d.toKm != null ? '<b>' + d.toKm + '</b> ' + t('kmAway') + ' · ' : ''}${t('updated')} ${ago(d.pos.at)} ${t('ago')}</p>` : ''}<div class="row2">${d.driverPhone ? `<a href="tel:${esc(d.driverPhone)}">${t('callDriver')}</a>` : ''}${d.pos && st === 'out' ? `<a target="_blank" rel="noopener" href="https://www.google.com/maps?q=${d.pos.lat},${d.pos.lng}">${t('seeMap')}</a>` : ''}</div></div>` : '';
  const eta = !finished && st !== 'out' && p.prepMin ? `<p class="muted">${isDl ? t('etaL') : t('prep_t')}: ~${p.prepMin} ${t('min_s')}</p>` : '';
  root.innerHTML = `<div class="ok"><div class="big">${ico}</div><h2 class="serif">${head}</h2>
  <p class="muted">${t('num')}</p><div style="font-size:34px;font-weight:800">${App.esc(p.number)}</div>${prog}
  ${st === 'failed' ? `<p class="err">${t('failedS')}</p>` : ''}${eta}${drv}${here}
  <p style="font-size:20px;font-weight:700">${App.money(p.total)}</p><p class="muted">${isCar ? t('payCar') : t('payNote')}</p>
  ${finished ? `<button class="btn" onclick="again()">${t('again')}</button>` : ''}</div>`;
  bar.innerHTML = '';
}
function again() { placed = null; save(); clearInterval(poll); render(); }
async function check() {
  if (!placed) return;
  try {
    const r = await fetch('/api/online/status/' + encodeURIComponent(placed.tid)), j = await r.json();
    if (j.status && j.status !== 'unknown') {
      const dj = JSON.stringify(j.delivery || null), changed = j.status !== placed.status || !!j.arrived !== !!placed.arrived || dj !== JSON.stringify(placed.delivery || null);
      if (changed) { placed.status = j.status; placed.arrived = !!j.arrived; placed.delivery = j.delivery || null; if (j.spot) placed.spot = j.spot; if (j.total) placed.total = j.total; save(); renderPlaced(); }
      if (j.status === 'done' || j.status === 'delivered' || j.status === 'failed') { clearInterval(poll); if (me) loadMe(); }
    }
  } catch {}
}
function startPoll() { clearInterval(poll); poll = setInterval(check, placed && placed.kind === 'delivery' ? 5000 : 8000); check(); }

(async function init() {
  try { const r = await fetch('/api/config'); if (!r.ok) throw 0; cfg = await r.json(); } catch { root.innerHTML = '<h2>Restaurant not found or suspended</h2>'; return; }
  App.config = cfg; App.applyTheme(); App.handlers = { render }; document.title = cfg.settings.name + ' · ' + t('title');
  if (saved.placed) { placed = saved.placed; if (placed.status === 'done') placed = null; }
  await loadMe();
  const q = new URLSearchParams(location.search); if (q.get('car') && carOn()) kind = 'car'; if (q.get('spot')) car.spot = q.get('spot').replace(/[^\w -]/g, '').slice(0, 12);
  render(); if (placed) startPoll();
})();
