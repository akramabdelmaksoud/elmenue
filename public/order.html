</style></head>
<body><div class="wrap" id="root"></div><div class="bar" id="bar"></div><div class="panel" id="panel" hidden></div>

<script>

};
const t = (k) => (T[App.lang] || T.en)[k] || T.en[k] || k;
const $ = (s) => document.querySelector(s), root = $('#root'), bar = $('#bar'), panel = $('#panel');
let cfg, cart = {}, kind = 'takeaway', cat = '', placed = null, poll = null, err = '', busy = false, geoPos = null, geoMsg = '';
const KEY = () => 'ol:' + App.slug;
const save = () => { try { localStorage.setItem(KEY(), JSON.stringify({ name: $('#fn') ? $('#fn').value : (saved.name || ''), phone: $('#fp') ? $('#fp').value : (saved.phone || ''), address: $('#fa') ? $('#fa').value : (saved.address || ''), carType: car.type, carColor: car.color, plate: car.plate, placed })); } catch {} };
let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY()) || '{}') || {}; } catch {}
let car = { type: saved.carType || '', color: saved.carColor || '', plate: saved.plate || '', spot: '' };
const C = () => (cfg.settings.car || {}), onlineOn = () => !!(cfg.features.online && O().enabled), carOn = () => !!(cfg.features.carservice && C().enabled);
const COLORS = { white: '#ffffff', black: '#1a1a1a', silver: '#c0c0c0', grey: '#808080', red: '#d62828', blue: '#2563eb', green: '#1f9d55', yellow: '#f2c230', orange: '#f08a1a', brown: '#7a4b2a', beige: '#d8c3a0', gold: '#c9a227', other: 'conic-gradient(#d62828,#f2c230,#1f9d55,#2563eb,#7c3aed,#d62828)' };
const colName = (k) => ((T[App.lang] || T.en).col || T.en.col)[k] || k;
function segBtns() {

  return `<label for="fct">${t('carType')}</label><input id="fct" maxlength="30" placeholder="${t('carTypeEx')}" value="${App.esc(car.type)}" oninput="car.type=this.value">
  <label>${t('carColor')}</label><div class="sws">${Object.keys(COLORS).map((k) => `<button type="button" class="sw ${car.color === k ? 'on' : ''}" data-c="${k}" title="${colName(k)}" aria-label="${colName(k)}" onclick="pickColor('${k}')"><i style="background:${COLORS[k]}"></i></button>`).join('')}</div><small class="muted" id="cn">${car.color ? colName(car.color) : ''}</small>
  ${cc.askPlate !== false ? `<label for="fcp">${t('plate')}</label><input id="fcp" maxlength="12" value="${App.esc(car.plate)}" oninput="car.plate=this.value">` : ''}
  <label>${t('spot')}</label>${sp ? `<div class="spots">${Array.from({ length: sp }, (_, i) => `<button type="button" class="${String(car.spot) === String(i + 1) ? 'on' : ''}" data-s="${i + 1}" onclick="pickSpot('${i + 1}')">${i + 1}</button>`).join('')}</div>` : `<input id="fcs" maxlength="12" placeholder="${t('spotEx')}" value="${App.esc(car.spot)}" oninput="car.spot=this.value">`}`;

function carBody() { if ($('#fct')) car.type = $('#fct').value; if ($('#fcp')) car.plate = $('#fcp').value; if ($('#fcs')) car.spot = $('#fcs').value; return { type: car.type, color: car.color, plate: car.plate, spot: car.spot }; }
async function imHere() {

}
const open = (c) => { const h = c && c.hours; if (!h || !h.from || !h.to) return true; const d = new Date(), m = d.getHours() * 60 + d.getMinutes(), [a1, a2] = h.from.split(':').map(Number), [b1, b2] = h.to.split(':').map(Number), a = a1 * 60 + a2, b = b1 * 60 + b2; return a <= b ? m >= a && m < b : m >= a || m < b; };
const O = () => (cfg.settings.online || {}), feeItem = () => O().feeItemId && cfg.items.find((i) => i.id === O().feeItemId);

const itemOf = (id) => cfg.items.find((i) => i.id === id) || { price: 0 };

function setCat(c) { cat = c; render(); }
function bump(key, d) { const l = cart[key]; if (!l) return; l.qty = Math.max(0, Math.min(20, l.qty + d)); if (!l.qty) delete cart[key]; render(); if (!panel.hidden) openCart(); }

function addLine(id, sel) { const k = lineKey(id, sel); if (cart[k]) cart[k].qty = Math.min(20, cart[k].qty + 1); else cart[k] = { itemId: id, qty: 1, sel }; render(); }

async function submitOrder(tries = 0) {

    const r = await fetch('/api/online/order', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }), j = await r.json().catch(() => ({}));
    if (r.status === 409 && tries < 3) { await new Promise((x) => setTimeout(x, 400 + tries * 400)); return submitOrder(tries + 1); }   // another write won the race: retry
    if (!r.ok || !j.ok) { busy = false; err = j.error || t('busy'); return openCart(); }
    busy = false; placed = { tid: j.tid, number: j.number, kind: j.kind, total: j.total, prepMin: j.prepMin, status: 'received', spot: body.car ? body.car.spot : '', arrived: false }; cart = {}; save(); panel.hidden = true; render(); startPoll();
  } catch { busy = false; err = t('busy'); openCart(); }
}

function renderPlaced() {
  const p = placed, st = p.status, isCar = p.kind === 'car', step = { received: 1, preparing: 2, ready: 3, done: 3 }[st] || 1, sp = C().spots || 0;
  const spotSel = sp ? `<select id="ps">${Array.from({ length: sp }, (_, i) => `<option value="${i + 1}" ${String(p.spot) === String(i + 1) ? 'selected' : ''}>${t('spotL')} ${i + 1}</option>`).join('')}</select>` : `<input id="ps" maxlength="12" placeholder="${t('spotEx')}" value="${App.esc(p.spot || '')}">`;
  const here = isCar && st !== 'done' ? (p.arrived ? `<p style="font-weight:700">✅ ${t('hereSent')}${p.spot ? ' · ' + t('spotL') + ' ' + App.esc(p.spot) : ''}</p>` : `<div class="card" style="text-align:start;margin:14px 0"><p style="margin:0 0 8px">${t('hereQ')}</p>${spotSel}<button class="btn" style="margin-top:10px" onclick="imHere()">${t('imHere')}</button></div>`) : '';
  root.innerHTML = `<div class="ok"><div class="big">${st === 'ready' || st === 'done' ? '✅' : isCar ? '🚗' : '🧾'}</div><h2 class="serif">${st === 'done' ? t('done') : st === 'ready' ? (isCar ? t('carReady') : t('ready_t')) : t('thanks')}</h2>
  <p class="muted">${t('num')}</p><div style="font-size:34px;font-weight:800">${App.esc(p.number)}</div>
  <div class="track"><i class="${step >= 1 ? 'on' : ''}"></i><i class="${step >= 2 ? 'on' : ''}"></i><i class="${step >= 3 ? 'on' : ''}"></i></div>
  <div class="row" style="justify-content:space-between"><small>${t('received')}</small><small>${t('preparing')}</small><small>${t('ready')}</small></div>
  ${st !== 'ready' && st !== 'done' ? `<p class="muted">${t('prep_t')}: ~${p.prepMin} ${t('min_s')}</p>` : ''}
  ${here}
  <p style="font-size:20px;font-weight:700">${App.money(p.total)}</p><p class="muted">${isCar ? t('payCar') : t('payNote')}</p>
  ${st === 'done' ? `<button class="btn" onclick="again()">${t('again')}</button>` : ''}</div>`;
  bar.innerHTML = '';
}
function again() { placed = null; save(); clearInterval(poll); render(); }
async function check() {
  if (!placed) return;
  try { const r = await fetch('/api/online/status/' + encodeURIComponent(placed.tid)), j = await r.json(); if (j.status && j.status !== 'unknown') { if (j.status !== placed.status || !!j.arrived !== !!placed.arrived) { placed.status = j.status; placed.arrived = !!j.arrived; if (j.spot) placed.spot = j.spot; if (j.total) placed.total = j.total; save(); renderPlaced(); } if (j.status === 'done') clearInterval(poll); } } catch {}
}
function startPoll() { clearInterval(poll); poll = setInterval(check, 8000); check(); }

(async function init() {
  try { const r = await fetch('/api/config'); if (!r.ok) throw 0; cfg = await r.json(); } catch { root.innerHTML = '<h2>Restaurant not found or suspended</h2>'; return; }
  App.config = cfg; App.applyTheme(); App.handlers = { render }; document.title = cfg.settings.name + ' · ' + t('title');
  if (saved.placed) { placed = saved.placed; if (placed.status === 'done') placed = null; }
  const q = new URLSearchParams(location.search); if (q.get('car') && carOn()) kind = 'car'; if (q.get('spot')) car.spot = q.get('spot').replace(/[^\w -]/g, '').slice(0, 12);
  render(); if (placed) startPoll();
})();
</script></body></html>
