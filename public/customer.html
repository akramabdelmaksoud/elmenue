<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu</title><link rel="stylesheet" href="/shared.css">
<style>
:root { --l1: 91%; --l2: 82%; --ease: cubic-bezier(.2,.9,.2,1); --spring: cubic-bezier(.34,1.56,.64,1); }
:root[data-dark="1"] { --l1: 27%; --l2: 19%; }
html { -webkit-tap-highlight-color: transparent; }
body { background: radial-gradient(900px 420px at 85% -8%, color-mix(in srgb, var(--accent2) 24%, transparent), transparent 70%), radial-gradient(700px 500px at -10% 40%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 70%), var(--bg); min-height: 100vh; overflow-x: hidden; }
.serif { font-family: var(--serif); letter-spacing: -.01em; }
#shell { max-width: 480px; margin: 0 auto; min-height: 100vh; position: relative; padding: 0 18px 130px; }
/* ambient floating bits */
.amb { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
.amb i { position: absolute; font-style: normal; opacity: .13; font-size: 38px; animation: drift 14s ease-in-out infinite; }
.amb i:nth-child(1) { top: 8%; inset-inline-start: 6%; } .amb i:nth-child(2) { top: 38%; inset-inline-end: 4%; animation-delay: -4s; font-size: 28px; } .amb i:nth-child(3) { top: 72%; inset-inline-start: 10%; animation-delay: -8s; } .amb i:nth-child(4) { top: 88%; inset-inline-end: 12%; animation-delay: -2s; font-size: 30px; }
@keyframes drift { 0%,100% { transform: translate(0,0) rotate(-8deg); } 50% { transform: translate(14px,-26px) rotate(12deg); } }
#shell > * { position: relative; z-index: 1; }
/* header */
header { position: sticky; top: 0; z-index: 30; display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; backdrop-filter: blur(14px); background: color-mix(in srgb, var(--bg) 70%, transparent); margin: 0 -18px; padding-inline: 18px; }
.logo { display: flex; align-items: center; gap: 9px; font-family: var(--serif); font-weight: 700; font-size: 19px; line-height: 1.05; }
.logo svg { width: 30px; height: 30px; color: var(--accent); animation: sway 5s ease-in-out infinite; transform-origin: 50% 100%; }
.logo small { display: block; font-family: inherit; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
@keyframes sway { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(6deg); } }
.hbtns { display: flex; gap: 8px; align-items: center; }
.ib { position: relative; width: 40px; height: 40px; padding: 0; border-radius: 50%; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); overflow: hidden; }
.ib svg { width: 20px; height: 20px; }
.ib .ico { position: absolute; display: grid; transition: transform .6s var(--spring), opacity .4s; }
:root[data-dark="1"] .sun { opacity: 0; transform: rotate(-120deg) scale(.3); } :root[data-dark="0"] .moon { opacity: 0; transform: rotate(120deg) scale(.3); }
.ib.bell.ring svg { animation: wiggle .7s; } .ib .dotb { position: absolute; top: 8px; inset-inline-end: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent2); animation: pulseDot 1.8s infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 15% { transform: rotate(18deg); } 30% { transform: rotate(-16deg); } 45% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } }
@keyframes pulseDot { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent2) 70%, transparent); } 100% { box-shadow: 0 0 0 10px transparent; } }
.langb { width: auto; border-radius: 99px; padding: 0 13px; gap: 6px; font-weight: 700; font-size: 13px; display: flex; }
/* pages & motion */
.page { animation: pageIn .6s var(--ease) both; }
@keyframes pageIn { from { opacity: 0; transform: translateX(var(--dx, 28px)) scale(.985); filter: blur(4px); } to { opacity: 1; transform: none; filter: none; } }
.rise { animation: rise .7s var(--ease) backwards; animation-delay: calc(var(--i, 0) * 75ms); }
@keyframes rise { from { opacity: 0; transform: translateY(26px) scale(.97); } to { opacity: 1; transform: none; } }
.page.still, .page.still .rise, .page.still .pop { animation: none !important; }
.page.still #grid.anim .rise { animation: rise .6s var(--ease) backwards !important; animation-delay: calc(var(--i, 0) * 60ms) !important; }
.pop { animation: popIn .55s var(--spring) backwards; animation-delay: calc(var(--i, 0) * 60ms); }
@keyframes popIn { from { opacity: 0; transform: scale(.4) rotate(-12deg); } to { opacity: 1; transform: none; } }
.tilt { transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .3s var(--ease), box-shadow .3s; will-change: transform; }
.rp { position: relative; overflow: hidden; } .rip { position: absolute; border-radius: 50%; background: currentColor; opacity: .25; transform: scale(0); animation: ripple .7s ease-out forwards; pointer-events: none; }
@keyframes ripple { to { transform: scale(1); opacity: 0; } }
h2, h3, h4 { margin: 0; }
/* hero */
.hero { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 22px 0 8px; min-height: 210px; }
.hero h2 { font-family: var(--serif); font-size: clamp(32px, 9vw, 40px); line-height: 1.08; font-weight: 700; color: var(--text); }
.hero h2 em { font-style: normal; background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent)); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shine 5s linear infinite; }
@keyframes shine { to { background-position: -220% 0; } }
.hero p { color: var(--muted); font-size: 14px; max-width: 210px; margin: 12px 0 0; line-height: 1.5; }
.hero .mugw { flex: none; width: 150px; }
.mug { width: 100%; filter: drop-shadow(0 18px 18px rgba(0,0,0,.22)); animation: floaty 5s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-10px) rotate(2deg); } }
.steam path { fill: none; stroke: var(--text); stroke-width: 4; stroke-linecap: round; opacity: 0; animation: steam 3.2s ease-in-out infinite; }
.steam path:nth-child(2) { animation-delay: .8s; } .steam path:nth-child(3) { animation-delay: 1.6s; }
@keyframes steam { 0% { opacity: 0; transform: translateY(14px); } 35% { opacity: .35; } 100% { opacity: 0; transform: translateY(-22px) scaleX(1.3); } }
/* cards */
.c { background: var(--card); border: 1px solid var(--line); border-radius: 26px; box-shadow: var(--shadow); }
.dish { display: flex; align-items: center; gap: 12px; padding: 18px; margin-top: 10px; overflow: hidden; position: relative; }
.dish::after { content: ''; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 30%, color-mix(in srgb, var(--accent2) 18%, transparent) 50%, transparent 70%); transform: translateX(-120%); animation: sweep 6s 1.5s infinite; pointer-events: none; }
@keyframes sweep { 60%,100% { transform: translateX(120%); } }
.dish .t { flex: 1; min-width: 0; } .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.dish h3 { font-family: var(--serif); font-size: 21px; margin: 6px 0 4px; } .dish p { margin: 0 0 8px; font-size: 13px; color: var(--muted); line-height: 1.4; }
.lnk { background: none; padding: 0; color: var(--accent); font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; } [dir=rtl] .lnk .arr { transform: scaleX(-1); }
.art { --h: 30; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(145deg, hsl(var(--h) 42% var(--l1)), hsl(var(--h) 36% var(--l2))); background-size: cover; background-position: center; position: relative; overflow: hidden; }
.art .e { font-size: 58px; filter: drop-shadow(0 10px 10px rgba(0,0,0,.25)); animation: bob 4.5s ease-in-out infinite; animation-delay: calc(var(--i, 0) * -700ms); }
.art::before { content: ''; position: absolute; width: 70%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.45), transparent 65%); top: -15%; inset-inline-start: -10%; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-7px) rotate(5deg); } }
.dish .art { width: 112px; height: 112px; flex: none; } .dish .art .e { font-size: 62px; }
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.tile { padding: 14px 4px 10px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-align: center; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); line-height: 1.2; }
.tile svg { width: 27px; height: 27px; color: var(--accent); transition: transform .5s var(--spring); } .tile:hover svg { transform: scale(1.25) rotate(-8deg); }
.feat { margin-top: 16px; border-radius: 28px; padding: 22px; position: relative; overflow: hidden; color: #f6efe0; background: radial-gradient(500px 220px at 90% 0%, color-mix(in srgb, var(--accent2) 45%, transparent), transparent 70%), linear-gradient(135deg, color-mix(in srgb, var(--accent) 88%, #000), color-mix(in srgb, var(--accent) 55%, #000)); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 190px; }
.feat h3 { font-family: var(--serif); font-size: 25px; line-height: 1.15; margin: 8px 0; } .feat .eyebrow { color: rgba(255,255,255,.65); } .feat p { margin: 0 0 14px; font-size: 13px; opacity: .8; max-width: 180px; }
.feat .price { font-weight: 800; font-size: 20px; margin-bottom: 12px; display: block; }
.cream { background: #f6efe0; color: #1f3a2b; font-weight: 800; padding: 12px 22px; border-radius: 99px; box-shadow: 0 10px 26px -10px rgba(0,0,0,.6); }
.feat .big { font-size: 116px; filter: drop-shadow(0 20px 18px rgba(0,0,0,.45)); animation: bob 5s ease-in-out infinite; flex: none; line-height: 1; }
.bean { position: absolute; font-size: 18px; opacity: .55; animation: drift 9s ease-in-out infinite; } .bean:nth-of-type(1) { bottom: 14px; inset-inline-end: 90px; } .bean:nth-of-type(2) { top: 18px; inset-inline-end: 24px; animation-delay: -3s; } .bean:nth-of-type(3) { bottom: 40px; inset-inline-end: 14px; animation-delay: -6s; }
.sec { display: flex; justify-content: space-between; align-items: baseline; margin: 26px 0 12px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.sec span { letter-spacing: 0; text-transform: none; font-weight: 600; }
.people { display: flex; gap: 14px; overflow-x: auto; padding: 16px 16px 14px; margin: -12px -16px 0; scrollbar-width: none; } .people::-webkit-scrollbar { display: none; }
.person { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; min-width: 62px; text-align: center; }
.person .av { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--card); border: 2px solid var(--line); box-shadow: var(--shadow); }
.person.me .av { border-color: var(--accent); animation: ringp 2.4s infinite; }
@keyframes ringp { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 100% { box-shadow: 0 0 0 14px transparent; } }
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 4px 2px 14px; scrollbar-width: none; } .rail::-webkit-scrollbar { display: none; }
.mini { flex: none; width: 138px; scroll-snap-align: start; padding: 10px; border-radius: 24px; } .mini .art { height: 96px; } .mini b { display: block; margin: 9px 2px 2px; font-size: 13px; line-height: 1.25; min-height: 33px; } .mini .pr { padding: 0 2px; color: var(--accent); font-weight: 800; font-size: 13px; }
/* menu */
.ptitle { font-family: var(--serif); font-size: 34px; font-weight: 700; margin: 18px 0 4px; } .psub { color: var(--muted); font-size: 14px; margin-bottom: 14px; }
.search { position: relative; margin-bottom: 14px; } .search svg { position: absolute; top: 50%; transform: translateY(-50%); inset-inline-start: 16px; width: 19px; color: var(--muted); } .search input { padding: 14px 16px 14px 46px; border-radius: 99px; background: var(--card); box-shadow: var(--shadow); } [dir=rtl] .search input { padding: 14px 46px 14px 16px; }
.chips { display: flex; gap: 9px; overflow-x: auto; padding: 2px 0 12px; scrollbar-width: none; } .chips::-webkit-scrollbar { display: none; }
.chip { flex: none; padding: 10px 18px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: 13px; transition: all .4s var(--spring); }
.chip.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); transform: scale(1.06); box-shadow: 0 10px 22px -10px var(--accent); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pc { padding: 10px; border-radius: 26px; position: relative; display: flex; flex-direction: column; }
.pc .art { height: 132px; } .pc b { margin: 11px 3px 2px; font-size: 14.5px; line-height: 1.25; } .pc small { color: var(--muted); font-size: 12px; margin: 0 3px; line-height: 1.35; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pc .foot { display: flex; align-items: center; justify-content: space-between; margin: 10px 3px 2px; } .pc .pr { font-weight: 800; color: var(--accent); }
.addb { width: 38px; height: 38px; padding: 0; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; box-shadow: 0 8px 18px -8px var(--accent); transition: transform .35s var(--spring); } .addb:hover { transform: scale(1.18) rotate(90deg); } .addb svg { width: 19px; }
.qb { position: absolute; top: 18px; inset-inline-end: 18px; z-index: 2; background: var(--accent2); color: #fff; font-weight: 800; font-size: 12px; padding: 3px 10px; border-radius: 99px; animation: popIn .5s var(--spring); }
.empty { text-align: center; color: var(--muted); padding: 40px 0; grid-column: 1/-1; } .empty .em { font-size: 52px; display: block; animation: bob 3s infinite; }
/* table / cart */
.row2 { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.li { padding: 14px; border-radius: 22px; margin-bottom: 10px; } .li .l { display: flex; gap: 12px; align-items: center; } .li .art { width: 52px; height: 52px; border-radius: 16px; flex: none; } .li .art .e { font-size: 28px; animation: none; }
.li b { font-size: 14.5px; } .li .sub { font-size: 12px; color: var(--muted); }
.stp { display: flex; align-items: center; gap: 10px; background: var(--card2); padding: 4px; border-radius: 99px; } .stp button { width: 30px; height: 30px; padding: 0; border-radius: 50%; background: var(--card); display: grid; place-items: center; } .stp svg { width: 15px; } .stp b { min-width: 16px; text-align: center; animation: popIn .35s var(--spring); }
.send { width: 100%; padding: 17px; border-radius: 99px; background: linear-gradient(120deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--accent2)), var(--accent)); background-size: 200% 100%; color: var(--on-accent); font-weight: 800; font-size: 16px; display: flex; gap: 10px; align-items: center; justify-content: center; box-shadow: 0 16px 32px -12px var(--accent); animation: shine2 4s linear infinite, glow 2.6s ease-in-out infinite; }
@keyframes shine2 { to { background-position: -200% 0; } } @keyframes glow { 50% { box-shadow: 0 20px 44px -8px var(--accent); } } .send svg { width: 20px; }
.note { margin-top: 10px; padding: 11px 14px; border-radius: 14px; font-size: 13px; }
.order { padding: 16px; border-radius: 24px; margin-bottom: 12px; }
.track { position: relative; display: flex; justify-content: space-between; margin: 14px 4px 6px; } .track::before, .track i.fill { content: ''; position: absolute; top: 9px; inset-inline: 9px; height: 4px; border-radius: 4px; background: var(--card2); } .track i.fill { background: linear-gradient(90deg, var(--accent), var(--accent2)); inset-inline-end: auto; width: calc((100% - 18px) * var(--p)); transition: width 1.2s var(--ease); }
.track span { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--muted); font-weight: 700; } .track span b { width: 22px; height: 22px; border-radius: 50%; background: var(--card2); border: 2px solid var(--line); display: grid; place-items: center; transition: all .6s var(--spring); } .track span.d { color: var(--text); } .track span.d b { background: var(--accent); border-color: var(--accent); color: var(--on-accent); transform: scale(1.1); } .track span.cur b { animation: ringp 1.6s infinite; } .track svg { width: 12px; }
.line { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; gap: 10px; } .muted { color: var(--muted); } .bigp { font-family: var(--serif); font-size: 26px; font-weight: 700; }
.guestbill { border-inline-start: 5px solid var(--accent); } .seg { display: flex; gap: 8px; flex-wrap: wrap; } .seg button { flex: 1; min-width: 90px; padding: 12px 10px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--line); font-weight: 700; font-size: 13px; transition: all .35s var(--spring); } .seg button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--card)); transform: translateY(-2px); }
.due { padding: 18px; border-radius: 24px; display: flex; justify-content: space-between; align-items: center; margin: 14px 0; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--card)), var(--card)); }
.gold { border-color: var(--accent2); animation: glowG 2.2s infinite; } @keyframes glowG { 50% { box-shadow: 0 0 34px -2px var(--accent2); } }
.h3 { font-family: var(--serif); font-size: 21px; margin: 22px 0 10px; font-weight: 700; }
/* profile */
.me-av { width: 108px; height: 108px; border-radius: 50%; margin: 18px auto 12px; display: grid; place-items: center; font-size: 56px; background: var(--card); border: 3px solid var(--accent); animation: ringp 2.4s infinite; }
.avs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 10px 0 16px; } .avs button { font-size: 26px; padding: 8px 0; border-radius: 16px; background: var(--card); border: 1.5px solid var(--line); transition: transform .3s var(--spring); } .avs button.on { border-color: var(--accent); transform: scale(1.12); }
/* nav */
nav { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); width: min(456px, calc(100% - 24px)); z-index: 40; display: flex; padding: 8px; border-radius: 30px; background: color-mix(in srgb, var(--card) 82%, transparent); backdrop-filter: blur(18px) saturate(1.4); border: 1px solid var(--line); box-shadow: 0 24px 50px -16px rgba(0,0,0,.45); }
nav button { flex: 1; background: none; border-radius: 22px; padding: 9px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--muted); position: relative; z-index: 1; transition: color .3s; }
nav button svg { width: 23px; height: 23px; transition: transform .5s var(--spring); } nav button.on { color: var(--accent); } nav button.on svg { transform: translateY(-2px) scale(1.15); } nav button.bump svg { animation: bumpi .6s var(--spring); }
@keyframes bumpi { 40% { transform: scale(1.6) rotate(-10deg); } }
#ind { position: absolute; top: 8px; bottom: 8px; border-radius: 22px; background: color-mix(in srgb, var(--accent) 15%, transparent); transition: transform .6s var(--spring), width .6s var(--spring); z-index: 0; }
nav .bdg { position: absolute; top: 2px; inset-inline-start: 56%; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 99px; background: var(--accent2); color: #fff; font-size: 11px; display: grid; place-items: center; animation: popIn .5s var(--spring); }
/* fx */
.fly { position: fixed; z-index: 100; font-size: 30px; pointer-events: none; }
.conf { position: fixed; z-index: 100; pointer-events: none; font-size: 22px; }
.skel { background: linear-gradient(100deg, var(--card2) 30%, color-mix(in srgb, var(--card2) 40%, var(--card)) 50%, var(--card2) 70%); background-size: 200% 100%; animation: shimmer 1.3s infinite; border-radius: 22px; } @keyframes shimmer { to { background-position: -200% 0; } }
.sheetbg { position: fixed; inset: 0; background: rgba(0,0,0,.45); backdrop-filter: blur(5px); z-index: 60; animation: fadeIn .3s; } @keyframes fadeIn { from { opacity: 0; } }
.sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(480px, 100%); z-index: 61; background: var(--card); border-radius: 32px 32px 0 0; padding: 12px 20px 30px; animation: up .55s var(--spring); box-shadow: 0 -20px 60px rgba(0,0,0,.4); } @keyframes up { from { transform: translate(-50%, 100%); } }
.sheet .grab { width: 44px; height: 5px; border-radius: 5px; background: var(--line); margin: 0 auto 14px; } .sheet .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.act { padding: 20px 8px; border-radius: 24px; background: var(--card2); display: flex; flex-direction: column; align-items: center; gap: 10px; font-weight: 800; font-size: 14px; } .act svg { width: 30px; height: 30px; color: var(--accent); } .act.urg svg { color: #e5484d; }
/* join */
.join { min-height: 100vh; display: grid; place-items: center; padding: 22px; position: relative; z-index: 1; } .join .c { width: 100%; max-width: 430px; padding: 26px; animation: popIn .7s var(--spring); }
.join input { border-radius: 16px; padding: 14px; font-size: 16px; }
@media (min-width: 560px) { #shell { padding-inline: 24px; } }
.lnk { padding: 10px 8px; min-height: 40px; margin: -10px -8px; }
.stp button { width: 36px; height: 36px; }
.join { grid-template-columns: minmax(0, 1fr); } .join .c { min-width: 0; }
.avs { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 380px) {
  #shell { padding-inline: 14px; } header { margin: 0 -14px; padding-inline: 14px; }
  .logo { font-size: 16px; min-width: 0; gap: 6px; } .logo svg { width: 26px; height: 26px; flex: none; } .logo > div { min-width: 0; } #bn { display: block; max-width: 96px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbtns { gap: 6px; } .langb { width: 40px; padding: 0; font-size: 0; gap: 0; justify-content: center; } .ib { width: 38px; height: 38px; } .langb { width: 38px; }

 <g transform="translate(60 80) scale(.9)" fill="none" stroke="var(--accent2)" stroke-width="2.2" stroke-linecap="round"><path d="M14 36V18"/><path d="M14 18C14 9 8 5 1 5c0 9 5 14 13 13z"/><path d="M14 24c0-7 5-10 13-10 0 7-5 11-13 10z"/></g>
 <g class="steam"><path d="M58 38c-6-8 6-12 0-22"/><path d="M80 38c-6-8 6-12 0-22"/><path d="M102 38c-6-8 6-12 0-22"/></g></svg>`;

let me = { id: App.ls(`gid:${SLUG}:${tableNumber}`), name: App.ls('name'), avatar: App.ls('avatar') };

/* ---------------- shell (built once, updated in place) ---------------- */
function build() {

  built = true;
}
const LBL = { home: 'home', menu: 'order', table: 'tableTab', bill: 'bill', profile: 'profile' };
function go(t) { if (t === tab) return; prevTab = tab; tab = t; animate = true; draw(true); window.scrollTo({ top: 0, behavior: 'smooth' }); }

}

function draw(force) {
  if (!S) return;

  if (!s) { root.innerHTML = `<div class="join"><div class="c" style="text-align:center"><div style="font-size:54px">👋</div><p>${App.tr('sessionEnded')}</p><button class="send rp" onclick="location.reload()">↻</button></div></div>`; built = false; return; }
  const ae = document.activeElement;
  if (!force && ae && ae.closest && ae.closest('#page') && /INPUT|TEXTAREA/.test(ae.tagName)) { dirty = true; return; }   // don't steal focus while typing
  dirty = false;
  if (!built) build();
  if (!cat || !cfg.categories.find((c) => c.id === cat)) cat = cfg.categories[0] && cfg.categories[0].id;
  const st = cfg.settings;
  $('#bn').textContent = App.lang === 'ar' && st.name_ar ? st.name_ar : st.name;

  page.style.setProperty('--dx', dirx * 34 + 'px');

  if (animate) { page.style.animation = 'none'; void page.offsetWidth; page.style.animation = ''; }
  page.innerHTML = ({ home: homeTab, menu: menuTab, table: tableTab, bill: billTab, profile: profileTab })[tab](cfg, s);
  if (!animate) page.classList.add('still'); else page.classList.remove('still');

window.addEventListener('resize', setInd);

/* ---------------- tabs ---------------- */
function homeTab(cfg, s) {
  const st = cfg.settings, its = cfg.items;

   ${o.items.map((i) => `<div class="line"><span>${guestOf(s, i.guestId).avatar} ${i.qty}× ${App.esc(App.nm(i))}${i.note ? ` <small class="muted">(${App.esc(i.note)})</small>` : ''}</span><span>${App.money(i.price * i.qty)}${i.guestId === me.id && o.status === 'received' ? ` <button class="ib" style="width:26px;height:26px;display:inline-grid;vertical-align:middle;margin-inline-start:4px" onclick="App.send({t:'order_item_remove',id:'${i.id}'})">${ic('x').replace('<svg', '<svg width="12" height="12"')}</button>` : ''}</span></div>`).join('')}</div>`; }).join('');

  ${mine.length ? `<button class="send rp" onclick="sendMine(this)">${ic('send')}${App.tr('sendFor')} · ${cnt(mineTotal, 'mine')}</button>` : ''}
  ${others.length ? `<div class="h3">${App.tr('tableOrder')}</div>${others.map((l, k) => line(l, false, k)).join('')}<button class="c note rp" style="width:100%" onclick="sendAll(this)">${ic('users').replace('<svg', '<svg width="18" height="18" style="vertical-align:-4px"')} ${App.tr('sendAll')} (${App.money(othersTotal)})</button>` : ''}
  ${s.orders.length ? `<div class="h3">${App.tr('orders')}</div>${orders}` : ''}`;
}
function tipOf(base) { return Math.round(base * pay.tip / 100); }
function checkBanner(s) {
  const c = s.check, b = s.bill, payer = guestOf(s, c.by), tip = Math.round(b.sub * (c.tipPct || 0) / 100);
  if (c.split === 'table') { const amt = App.money(b.total + tip); return c.by === me.id ? `👥 ${App.tr('youPayAll')}: <b>${amt}</b>` : `${payer.avatar} <b>${App.esc(payer.name)}</b> ${App.tr('paysAll')}: <b>${amt}</b><br><span class="muted">${App.tr('nothingToPay')}</span>`; }
  const g = b.byGuest[me.id] || { sub: 0, total: 0 };
  const mineDue = c.split === 'custom' ? (+(c.custom || {})[me.id] || 0) : g.total + Math.round(g.sub * (c.tipPct || 0) / 100);
  return `${App.tr('yourShare')}: <b>${App.money(mineDue)}</b>`;
}
function billTab(cfg, s) {
  const b = s.bill, G = s.guests;
  if (!s.orders.length) return `<h2 class="ptitle rise">${App.tr('bill')}</h2><div class="empty rise"><span class="em">🧾</span>${App.tr('empty')}</div>`;
  const my = b.byGuest[me.id] || { sub: 0, total: 0 };
  const base = pay.split === 'self' ? my : b;
  let due = base.total + tipOf(base.sub);
  if (pay.split === 'custom') due = +pay.custom[me.id] || 0;
  const sum = pay.split === 'custom' ? G.reduce((n, g) => n + (+pay.custom[g.id] || 0), 0) : 0;
  const withTip = b.total + tipOf(b.sub), st = cfg.settings;
  return `<h2 class="ptitle rise">${App.tr('sessionTotal')}</h2>
  ${G.map((g, k) => { const x = b.byGuest[g.id] || { sub: 0, service: 0, tax: 0, total: 0, items: [] }; return `<div class="c li guestbill rise" style="--i:${k + 1}"><div class="row2"><b style="font-size:16px"><span style="font-size:22px">${g.avatar}</span> ${App.esc(g.name)}${g.id === me.id ? ' · ' + App.tr('youLabel') : ''}</b><b class="serif" style="font-size:19px">${App.money(x.total)}</b></div>
   ${x.items.map((i) => `<div class="line muted"><span>${i.qty}× ${App.esc(App.nm(i))}</span><span>${App.money(i.price * i.qty)}</span></div>`).join('')}</div>`; }).join('')}
  <div class="c li rise" style="--i:5"><div class="line"><span>${App.tr('subtotal')}</span><span>${App.money(b.sub)}</span></div><div class="line"><span>${App.tr('service')} (${st.service}%)</span><span>${App.money(b.service)}</span></div><div class="line"><span>${App.tr('tax')} (${st.tax}%)</span><span>${App.money(b.tax)}</span></div>
  <div class="line"><span>${App.tr('tip')} (${pay.tip}%)</span><span>${App.money(tipOf(b.sub))}</span></div><div class="line" style="border-top:1px dashed var(--line);margin-top:6px;padding-top:10px"><b>${App.tr('total')}</b><b class="bigp">${cnt(withTip, 'tot')}</b></div></div>
  <div class="h3">${App.tr('tip')}</div><div class="seg">${[0, 5, 10, 15, 20].map((p) => `<button class="rp ${pay.tip === p ? 'on' : ''}" onclick="pay.tip=${p};draw(true)">${p}%</button>`).join('')}</div>
  <div class="h3">${App.tr('bill')}</div><div class="seg"><button class="rp ${pay.split === 'self' ? 'on' : ''}" onclick="pay.split='self';draw(true)">👤 ${App.tr('payMine')}</button><button class="rp ${pay.split === 'table' ? 'on' : ''}" onclick="pay.split='table';draw(true)">👥 ${App.tr('payTable')}</button><button class="rp ${pay.split === 'custom' ? 'on' : ''}" onclick="pay.split='custom';draw(true)">✂️ ${App.tr('payCustom')}</button></div>
  ${pay.split === 'custom' ? `<div class="c li" style="margin-top:12px"><p class="muted" style="margin:0 0 8px">${App.tr('assign')}</p>${G.map((g) => `<div class="row" style="margin-bottom:8px;gap:10px"><span style="font-size:22px">${g.avatar}</span><span style="flex:1">${App.esc(g.name)}</span><input type="number" style="width:120px;border-radius:14px" value="${pay.custom[g.id] ?? ''}" placeholder="${Math.round(withTip / G.length)}" onchange="pay.custom['${g.id}']=this.value;draw(true)"></div>`).join('')}
   <div class="muted">${App.money(sum)} / ${App.money(withTip)}</div><button class="lnk" style="margin-top:6px" onclick="splitEq(${withTip})">= ${App.tr('perPerson')}</button></div>` : ''}
  <div class="seg" style="margin-top:12px"><button class="rp ${pay.method === 'cash' ? 'on' : ''}" onclick="pay.method='cash';draw(true)">💵 ${App.tr('cash')}</button><button class="rp ${pay.method === 'card' ? 'on' : ''}" onclick="pay.method='card';draw(true)">💳 ${App.tr('card')}</button></div>
  <div class="c due"><span>${App.tr('total_due')}</span><span class="bigp" style="color:var(--accent)">${cnt(due, 'due')}</span></div>
  ${s.check ? `<div class="c li gold" style="text-align:center;line-height:1.7">${checkBanner(s)}<br>✅ ${App.tr('checkSent')}<br><button class="lnk" style="margin-top:8px" onclick="App.send({t:'check_cancel'})">${App.tr('cancel')}</button></div>`
   : `<button class="send rp" onclick="App.send({t:'check',method:pay.method,split:pay.split,tipPct:pay.tip,custom:pay.custom});burstAt(this)">${ic('receipt')}${App.tr('reqBill')}</button>`}`;
}
function splitEq(total) { const n = S.session.guests.length; S.session.guests.forEach((g) => (pay.custom[g.id] = Math.round(total / n))); draw(true); }
function profileTab(cfg, s) {
  return `<div class="rise"><div class="me-av" id="mav">${me.avatar}</div><h2 class="ptitle" style="text-align:center;margin:0">${App.esc(me.name)}</h2><p class="psub" style="text-align:center">${App.tr('table')} ${tableNumber} · ${s.guests.length} ${App.tr('guests')}</p></div>
  <div class="c li rise" style="--i:1"><input id="pn" value="${App.esc(me.name)}" maxlength="20" style="border-radius:16px;padding:14px" placeholder="${App.tr('pickName')}">
   <div class="avs" style="margin-bottom:6px">${AV.map((a) => `<button class="rp ${a === me.avatar ? 'on' : ''}" data-a="${a}" onclick="pickAv('${a}')">${a}</button>`).join('')}</div>
   <button class="send rp" onclick="saveProfile()">${ic('check')}${App.tr('save')}</button></div>
  <div class="h3 rise" style="--i:2">${App.tr('language')}</div><div class="seg rise" style="--i:3"><button class="rp ${App.lang === 'en' ? 'on' : ''}" onclick="if(App.lang!=='en')App.toggleLang(event)">English</button><button class="rp ${App.lang === 'ar' ? 'on' : ''}" onclick="if(App.lang!=='ar')App.toggleLang(event)">العربية</button></div>
  <div class="h3 rise" style="--i:4">${App.tr('theme')}</div><div class="seg rise" style="--i:5"><button class="rp ${!App.isDark() ? 'on' : ''}" onclick="if(App.isDark())App.toggleMode(event)">☀️ ${App.tr('light')}</button><button class="rp ${App.isDark() ? 'on' : ''}" onclick="if(!App.isDark())App.toggleMode(event)">🌙 ${App.tr('dark')}</button></div>`;
}
function pickAv(a) { me.avatar = a; $('#mav').textContent = a; document.querySelectorAll('.avs button').forEach((b) => b.classList.toggle('on', b.dataset.a === a)); $('#mav').animate([{ transform: 'scale(.6) rotate(-20deg)' }, { transform: 'scale(1.12)' }, { transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.34,1.56,.64,1)' }); }
function saveProfile() { me.name = $('#pn').value.trim() || me.name; App.ls('name', me.name); App.ls('avatar', me.avatar); App.send({ t: 'profile', name: me.name, avatar: me.avatar }); App.toast('✓ ' + App.tr('save')); }

/* ---------------- actions & effects ---------------- */
function add(id, el) { const it = S.config.items.find((x) => x.id === id); App.send({ t: 'cart_add', itemId: id }); App.toast(App.tr('addToCart')); if (it) fly(el, it.emoji); }
function req(type) { App.send({ t: 'request', type }); App.toast(App.tr('requestSent')); const b = $('#bellb'); b.classList.remove('ring'); void b.offsetWidth; b.classList.add('ring'); closeSheet(); }
function sendMine(el) { burstAt(el); App.send({ t: 'send_order' }); App.toast(App.tr('orderSent')); }
function sendAll(el) { burstAt(el); App.send({ t: 'send_order', scope: 'all' }); App.toast(App.tr('orderSent')); }
function openSheet() {
  $('#layer').innerHTML = `<div class="sheetbg" onclick="closeSheet()"></div><div class="sheet"><div class="grab"></div><h3 class="serif" style="font-size:24px">${App.tr('quickAct')}</h3>
  <div class="acts"><button class="act rp" onclick="req('waiter')">${ic('bell')}${App.tr('callWaiter')}</button><button class="act rp" onclick="req('water')">${ic('water')}${App.tr('water')}</button>
  <button class="act rp urg" onclick="req('urgent')">${ic('bolt')}${App.tr('urgent')}</button><button class="act rp" onclick="closeSheet();go('bill')">${ic('receipt')}${App.tr('reqBill')}</button></div></div>`;
}
function closeSheet() { const l = $('#layer'); const sh = l.querySelector('.sheet'); if (!sh) return; sh.style.transition = 'transform .35s'; sh.style.transform = 'translate(-50%,100%)'; setTimeout(() => (l.innerHTML = ''), 320); }
function fly(el, emoji) {
  const nav = $('#nav [data-t=table]'); if (!el || !nav) return;
  const a = el.getBoundingClientRect(), b = nav.getBoundingClientRect();
  const f = document.createElement('div'); f.className = 'fly'; f.textContent = emoji; f.style.left = a.left + a.width / 2 + 'px'; f.style.top = a.top + a.height / 2 + 'px'; document.body.appendChild(f);
  const dx = b.left + b.width / 2 - (a.left + a.width / 2), dy = b.top + b.height / 2 - (a.top + a.height / 2);
  f.animate([{ transform: 'translate(-50%,-50%) scale(1)', opacity: 1 }, { transform: `translate(calc(-50% + ${dx * .45}px),calc(-50% + ${dy * .5 - 110}px)) scale(1.6) rotate(200deg)`, opacity: 1, offset: .5 }, { transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(.25) rotate(380deg)`, opacity: .3 }], { duration: 850, easing: 'cubic-bezier(.45,0,.3,1)' }).onfinish = () => { f.remove(); nav.classList.remove('bump'); void nav.offsetWidth; nav.classList.add('bump'); setTimeout(() => nav.classList.remove('bump'), 650); };
}
function burstAt(el) { const r = el.getBoundingClientRect(); burst(r.left + r.width / 2, r.top + r.height / 2); }
function burst(x, y) {
  const set = ['🌿', '☕', '✨', '🫘', '💛', '🍃'];
  for (let i = 0; i < 22; i++) {
    const p = document.createElement('div'); p.className = 'conf'; p.textContent = set[i % set.length]; p.style.left = x + 'px'; p.style.top = y + 'px'; document.body.appendChild(p);
    const ang = Math.random() * Math.PI * 2, d = 90 + Math.random() * 170;
    p.animate([{ transform: 'translate(-50%,-50%) scale(.3)', opacity: 1 }, { transform: `translate(calc(-50% + ${Math.cos(ang) * d}px),calc(-50% + ${Math.sin(ang) * d - 60}px)) scale(1.3) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .55 }, { transform: `translate(calc(-50% + ${Math.cos(ang) * d * 1.1}px),calc(-50% + ${Math.sin(ang) * d + 120}px)) scale(.6)`, opacity: 0 }], { duration: 1200 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
  }
}
function countUp() {
  document.querySelectorAll('.cnt').forEach((el) => {
    const v = +el.dataset.v, k = el.dataset.k, from = prevNum[k] ?? 0; prevNum[k] = v;
    if (from === v) return;
    const t0 = performance.now(), D = 800;
    (function f(t) { const p = Math.min(1, (t - t0) / D), e = 1 - Math.pow(1 - p, 3); el.textContent = App.money(from + (v - from) * e); if (p < 1) requestAnimationFrame(f); })(t0);
  });
}
// ripple + tilt (delegated)
document.addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.rp'); if (!b) return;
  const r = b.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2.2, i = document.createElement('span'); i.className = 'rip';
  i.style.cssText = `width:${s}px;height:${s}px;left:${e.clientX - r.left - s / 2}px;top:${e.clientY - r.top - s / 2}px`; b.appendChild(i); setTimeout(() => i.remove(), 700);
});
document.addEventListener('pointermove', (e) => {
  if (e.pointerType !== 'mouse') return;
  const t = e.target.closest('.tilt'); if (!t) return; const r = t.getBoundingClientRect();
  t.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 9 + 'deg'); t.style.setProperty('--rx', (.5 - (e.clientY - r.top) / r.height) * 9 + 'deg');
});
document.addEventListener('pointerout', (e) => { const t = e.target.closest && e.target.closest('.tilt'); if (t && !t.contains(e.relatedTarget)) { t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); } });

/* ---------------- go ---------------- */
App.handlers = { render: joinScreen };
fetch('/api/config').then((r) => r.json()).then((c) => { App.config = c; App.applyTheme(); if (me.name) start(); else joinScreen(); });
</script></body></html>
