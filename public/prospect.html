<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Live demo</title><meta name="robots" content="noindex"><meta name="theme-color" content="#173f2e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#173f2e;--g2:#2e7d4f;--lime:#8bc34a;--bg:#eef4de;--card:#fff;--text:#12301f;--muted:#55705f;--line:#d5e2c0}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 Cairo,Inter,system-ui,sans-serif}
body[dir=ltr]{font-family:Inter,Cairo,system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px calc(40px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:flex-end;padding:calc(14px + env(safe-area-inset-top)) 0 0}
.btn{font:inherit;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--g);padding:9px 16px;border-radius:99px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn.p{background:var(--g);color:#fff;border-color:var(--g)}
.hero{text-align:center;padding:18px 0 8px}
.hero img{width:104px;height:104px;border-radius:50%;box-shadow:0 10px 30px -10px rgba(23,63,46,.6)}
h1{margin:14px 0 6px;font-size:clamp(26px,5vw,40px);line-height:1.2;color:var(--g);font-weight:800}
.lead{margin:0 auto;max-width:640px;color:var(--muted);font-size:17px}
.live{display:inline-flex;gap:8px;align-items:center;margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 16px;font-size:14px;font-weight:600}
.live i{width:9px;height:9px;border-radius:50%;background:#2fb457;box-shadow:0 0 0 0 #2fb457;animation:p 2s infinite}@keyframes p{70%{box-shadow:0 0 0 10px rgba(47,180,87,0)}100%{box-shadow:0 0 0 0 rgba(47,180,87,0)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-top:26px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 12px 30px -22px rgba(23,63,46,.5)}
.card .h{display:flex;gap:12px;align-items:center}.ic{width:48px;height:48px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:25px;flex:none}
.card h3{margin:0;font-size:18px;line-height:1.2}.card small{color:var(--muted);display:block;font-size:14px}
.card p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.qr{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;width:150px;align-self:center}.qr img{width:100%;display:block}
.row{display:flex;gap:8px}.row>*{flex:1}
.how{margin:34px 0 0;background:var(--g);color:#fff;border-radius:22px;padding:22px}.how h2{margin:0 0 8px;font-size:21px}.how ol{margin:0;padding-inline-start:22px;color:#dbe9cf}.how li{margin:4px 0}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--g);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}.toast.on{opacity:1}
</style></head>
<body><div class="wrap">
<div class="top"><button class="btn" id="lang"></button></div>
<div class="hero"><img id="logo" alt="" hidden><h1 id="h1">…</h1><p class="lead" id="lead"></p><span class="live"><i></i><span id="livet"></span></span></div>
<div class="grid" id="grid"></div>
<div class="how"><h2 id="hw"></h2><ol id="steps"></ol></div>
<div class="foot" id="foot"></div>
</div><div class="toast" id="toast"></div>
<script>
const T = {
  ar: { lead: 'ده المكان بتاعك على TableTab: المنيو والأسعار والألوان بتاعتك. افتح كل شاشة على جهاز مختلف وشوف الطلب بيتحرك من الزبون للمطبخ للكاشير لحظة بلحظة.', live: 'تجربة حية · من غير باسورد',
    guest: ['الزبون', 'موبايل · يمسح QR الطاولة', 'بيشوف المنيو بصور الأكل ويطلب من مكانه.'], waiter: ['الويتر', 'آيباد / موبايل · الصالة', 'بيستلم الطلبات ويتابع الطاولات.'], kitchen: ['المطبخ', 'لابتوب / شاشة', 'تيكتات حية مقسمة مطبخ وبار.'], cashier: ['الكاشير', 'كمبيوتر الكاشير', 'الحساب والدفع وإقفال الطاولة.'], owner: ['صاحب الكافيه', 'لابتوب · لوحة التحكم', 'المبيعات والتقارير والمنيو والعاملين.'], order: ['اطلب أونلاين', 'موبايل · استلام وتوصيل', 'نفس المنيو للطلبات الخارجية.'],
    table: 'طاولة', open: 'افتح', copy: 'انسخ الرابط', copied: 'تم نسخ الرابط ✓', hw: 'جرّب بالترتيب ده',
    s: ['من موبايلك افتح «الزبون» واطلب كام صنف من المنيو.', 'افتح «المطبخ» على لابتوب: هتلاقي الطلب وصل وقسّم مطبخ وبار.', 'افتح «الويتر» و«الكاشير» وكمّل الطلب لحد الحساب.', 'افتح «صاحب الكافيه» وشوف المبيعات والتقارير.'],
    foot: 'كل البيانات هنا تجريبية. الأسعار والمنيو من منيو الكافيه الحقيقي.' },
  en: { lead: 'This is your café on TableTab: your menu, prices and colours. Open each screen on a different device and watch an order move from the guest to the kitchen to the cashier, live.', live: 'Live demo · no password',
    guest: ['Guest', 'Phone · scans the table QR', 'Browses the menu with photos and orders from the table.'], waiter: ['Waiter', 'iPad / phone · the floor', 'Receives orders and follows the tables.'], kitchen: ['Kitchen', 'Laptop / TV', 'Live tickets split by kitchen and bar.'], cashier: ['Cashier', 'Counter PC', 'Bills, payment and closing tables.'], owner: ['Owner', 'Laptop · dashboard', 'Sales, reports, menu and staff.'], order: ['Order online', 'Phone · pickup & delivery', 'The same menu for outside orders.'],
    table: 'Table', open: 'Open', copy: 'Copy link', copied: 'Link copied ✓', hw: 'Try it in this order',
    s: ['On your phone open “Guest” and order a few items.', 'Open “Kitchen” on a laptop: the order arrives split between kitchen and bar.', 'Open “Waiter” and “Cashier” and take the order through to the bill.', 'Open “Owner” and look at the sales and reports.'],
    foot: 'All data here is demo data. The menu and prices come from the café’s real menu.' } };
const slug = (location.pathname.match(/^\/p\/([^/?#]+)/) || [])[1] || '';
let lang = (() => { try { return localStorage.getItem('plang') === 'en' ? 'en' : 'ar'; } catch { return 'ar'; } })(), info = null, tbl = null;
const $ = (id) => document.getElementById(id), t = (k) => T[lang][k];
const link = (k) => info.origin + (k === 'guest' ? `/r/${info.slug}/t/${tbl}` : k === 'order' ? `/r/${info.slug}/order` : `/r/${info.slug}/${{ waiter: 'captain', kitchen: 'kitchen', cashier: 'cashier', owner: 'admin' }[k]}?auto=1`);
const qr = (u) => `/api/demo/qr.png?u=${encodeURIComponent(u)}`;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m) { const e = $('toast'); e.textContent = m; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 1800); }
function paint() {
  document.documentElement.lang = lang; document.body.dir = lang === 'ar' ? 'rtl' : 'ltr'; $('lang').textContent = lang === 'ar' ? 'English' : 'عربي';
  if (!info) return;
  const nm = lang === 'ar' ? info.name_ar || info.name : info.name; document.title = nm + ' · TableTab'; $('h1').textContent = nm;
  $('lead').textContent = t('lead'); $('livet').textContent = t('live'); $('hw').textContent = t('hw'); $('foot').textContent = t('foot'); $('steps').innerHTML = t('s').map((x) => `<li>${esc(x)}</li>`).join('');
  if (info.logo) { $('logo').src = info.logo; $('logo').hidden = false; }
  const roles = [['guest', '👤'], ['kitchen', '👨‍🍳'], ['waiter', '🧑‍✈️'], ['cashier', '💵'], ['owner', '⚙️'], ['order', '🛵']];
  $('grid').innerHTML = roles.map(([k, ic]) => { const [a, b, c] = t(k);
    return `<div class="card"><div class="h"><div class="ic">${ic}</div><div><h3>${esc(a)}</h3><small>${esc(b)}</small></div></div><p>${esc(c)}</p>
    ${k === 'guest' ? `<select onchange="tbl=this.value;paint()" style="font:inherit;padding:8px;border-radius:12px;border:1px solid var(--line)">${(info.freeTables.length ? info.freeTables : info.tables).map((n) => `<option value="${n}" ${n == tbl ? 'selected' : ''}>${t('table')} ${n}</option>`).join('')}</select>` : ''}
    <div class="qr"><img alt="QR" src="${qr(link(k))}"></div>
    <div class="row"><a class="btn p" href="${link(k)}" target="_blank" rel="noopener">${t('open')}</a><button class="btn" onclick="copyL('${k}')">${t('copy')}</button></div></div>`; }).join('');
}
async function copyL(k) { try { await navigator.clipboard.writeText(link(k)); toast(t('copied')); } catch { prompt('', link(k)); } }
$('lang').onclick = () => { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('plang', lang); } catch {} paint(); };
(async () => { try { const r = await fetch('/api/prospect/info?slug=' + encodeURIComponent(slug)); if (!r.ok) throw 0; info = await r.json(); tbl = info.freeTables[0] || info.tables[0]; paint(); } catch { $('h1').textContent = lang === 'ar' ? 'الصفحة مش موجودة' : 'Page not found'; } })();
paint();
</script></body></html>
